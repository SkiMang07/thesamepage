 const scoped=data.filter(g=>g.level===level),open=scoped.filter(isOpen),review=open.filter(g=>reasons(g).length),missing=open.filter(noCheck);
 $('stats').innerHTML=mode==='error'?'':[['all',open.length,'open goals'],['review',review.length,'need review'],['missing',missing.length,'without check-ins']].map(([k,n,t])=>`<button class="stat ${filter===k?'selected':''}" data-filter="${k}" aria-label="${n} ${t}" title="Within ${labels[level]} goals"><b class="${k==='review'&&n?'amber':''}">${n}</b><span>${t}</span></button>`).join('');
 if(mode==='observed'&&level==='individual')$('stats').innerHTML='';
 $('filters').innerHTML=[['all','All'],['review','Needs review'],['missing','No check-ins'],['closed','Closed']].map(([k,t])=>`<button data-filter="${k}" aria-pressed="${filter===k}">${t}</button>`).join('');
 $('listTitle').textContent=labels[level]+' goals';$('footer').textContent=mode==='observed'?'Partial observed snapshot · Individual goals and omitted details remain unknown. Counts above apply to the selected level.':'Illustrative example · September 25, 2026 · Counts above apply to the selected level. Refresh resets changes.';
 renderList();renderFocus();
}
function goalRow(g){let why=reasons(g),p=progress(g);return `<button class="goal-row" data-goal="${g.id}" aria-pressed="${selected===g.id}"><span><span class="goal-name">${esc(g.title)}</span><span class="goal-meta">${esc(g.scope)} · ${dueLabel(g)}</span>${latest(g)?.note?`<span class="goal-note">${esc(latest(g).note)}</span>`:''}<span class="${why.length?'goal-reason':'goal-meta'}" style="margin-top:8px">${why.length?esc(why.join(' · ')):!isOpen(g)?statuses[g.status]:noCheck(g)?'No check-ins yet':'Latest check-in '+(lastDate(g)?date(lastDate(g)):'date not inspected')}</span></span><span class="goal-right">${badge(g)}${p!=null?`<span class="percent">${p}%</span><span class="meta">last recorded</span>`:''}</span></button>`}
function groupRows(gs){if(level!=='individual')return gs.map(goalRow).join('');let names=[...new Set(gs.map(g=>g.scope))];return names.map(n=>`<div class="group-label"><span class="avatar">${esc(n.split(' ').map(s=>s[0]).slice(0,2).join(''))}</span><span class="meta">${esc(n)}</span></div>${gs.filter(g=>g.scope===n).map(goalRow).join('')}`).join('')}
function renderList(){
 if(mode==='error'){ $('listCount').textContent='';$('list').innerHTML='<div class="blank"><h2>Goals couldn’t load.</h2><p>The latest records are unavailable.</p><button class="secondary" data-action="retry">Try again</button></div>';return}
 if(loading){$('list').innerHTML='<div role="status" aria-label="Loading goals"><div class="skeleton"></div><div class="skeleton"></div></div>';return}
 if(mode==='observed'&&level==='individual'){$('listCount').textContent='Not inspected';$('list').innerHTML='<div class="blank">Individual goals were not inspected in the account snapshot. The illustrative example shows the proposed person grouping.</div>';return}
 const gs=data.filter(matches), review=gs.filter(g=>reasons(g).length),missing=gs.filter(noCheck),other=gs.filter(g=>isOpen(g)&&!reasons(g).length&&!noCheck(g)),closed=gs.filter(g=>!isOpen(g));$('listCount').textContent=gs.length+' in view';
 if(!gs.length){$('list').innerHTML=`<div class="blank"><h2>${query?'No matching goals.':filter==='review'?'No goals need review here.':filter==='missing'?'Every open goal has a check-in.':filter==='closed'?'No closed goals here.':'No '+labels[level].toLowerCase()+' goals yet.'}</h2><p>${query?'Try another title, person or success metric.':filter==='review'?'Based on recorded status, due dates and check-in age.':''}</p>${filter!=='all'?'<button class="quiet" data-filter="all">Show all goals →</button>':!query?'<button class="quiet" data-action="new">+ New goal</button>':''}</div>`;return}
 if(filter!=='all'||query){$('list').innerHTML=groupRows(gs);return}
 const section=(title,items)=>items.length?`<div class="group-label"><span class="eyebrow">${title}</span><span class="meta">${items.length}</span></div>${groupRows(items)}`:'';
 $('list').innerHTML=section('Needs review',review)+section('No check-ins',missing)+(other.length?`<details class="fold" ${!review.length&&!missing.length||other.some(g=>g.id===selected)?'open':''}><summary>${other.length} other open goal${other.length===1?'':'s'}</summary>${groupRows(other)}</details>`:'')+(closed.length?`<details class="fold" ${closed.some(g=>g.id===selected)?'open':''}><summary>${closed.length} closed goal${closed.length===1?'':'s'}</summary>${groupRows(closed)}</details>`:'');
}
function renderFocus(){
 if(editor==='new'){renderGoalForm(null);return} const g=current();
 if(!g||mode==='error'){$('focus').innerHTML=`<div class="eyebrow">Goal detail</div><h2>${mode==='error'?'Waiting for goal records.':'A closer look.'}</h2><p class="meta">${mode==='error'?'A load failure does not mean there are no goals.':'Choose a goal to see its success metric, latest update and connections.'}</p>`;return}
 if(editor==='goal'){renderGoalForm(g);return}
 const p=progress(g),pr=progressRecord(g),last=latest(g),children=data.filter(c=>c.parent===g.id),parent=data.find(c=>c.id===g.parent),pd=g.progressDate||pr?.date;
 $('focus').innerHTML=`<button class="quiet back-list" data-action="backlist">← Back to goals</button>${receipt?`<div class="receipt" role="status"><b>Check-in saved in this preview</b><p>${esc(receipt)}</p><span class="meta">Nothing was sent or saved to your account.</span></div>`:''}${!matches(g)?'<p class="meta" style="margin-bottom:14px">This goal is outside the current list filter. Its details remain open.</p>':''}<div class="row between"><span class="eyebrow">${labels[g.level]} goal</span><label><span class="meta" style="margin-right:7px">Status</span><select class="status-select" id="status" aria-label="Goal status">${Object.entries(statuses).map(([k,v])=>`<option value="${k}" ${k===g.status?'selected':''}>${v}</option>`).join('')}</select></label></div><h2>${esc(g.title)}</h2><div class="scope row"><span class="meta">${esc(g.scope)}</span><span class="meta">${dueLabel(g)}</span></div><div class="eyebrow">Success metric</div><p class="metric" style="white-space:pre-wrap">${g.metric?esc(g.metric):'<span class="meta">No success metric recorded.</span>'}</p>
 <div class="divider"><div class="row between"><h3>Latest check-in</h3><span class="meta ${age(g)>14?'amber':''}">${lastDate(g)?date(lastDate(g)):g.historyUnknown?'Date not inspected':'No check-ins yet'}</span></div>${last?`<div class="last-update"><p>${last.note?esc(last.note):'No note recorded for this check-in.'}</p><span class="meta">Recorded status: ${statuses[last.status]}</span>${last.source?`<button class="quiet" style="display:block;font-size:12px" data-source="${esc(last.source)}">${esc(last.source)} ↗</button>`:''}</div>`:g.omitted||g.historyUnknown?'<p class="meta" style="margin-top:14px">Check-in narrative is omitted from this account snapshot. Switch to the illustrative example to explore dated notes.</p>':'<p class="meta" style="margin-top:14px">No update has been recorded for this goal.</p>'}
 ${p!=null?`<div class="progressline"><strong>${p}%</strong><div class="bar" aria-hidden="true"><i style="width:${p}%"></i></div></div><p class="meta">Last recorded percentage${pd?' · '+date(pd):' · date not inspected'}${pd&&lastDate(g)&&pd!==lastDate(g)?'<br>The latest check-in did not change this percentage.':''}</p>`:'<p class="meta" style="margin-top:17px">No percentage recorded.</p>'}
 ${editor==='checkin'?'':`<div class="focus-actions row"><button class="primary" data-action="checkin">Log check-in</button>${(g.history.length||g.omitted||g.historyUnknown)?'<button class="quiet" data-action="history">View history ↓</button>':''}</div>`}<div id="checkinSlot"></div></div>
 <details id="history"><summary>Check-in history${g.history.length?' · '+g.history.length:''}</summary>${g.history.map(c=>`<article class="history-item"><span class="meta">${date(c.date)} · ${statuses[c.status]}${c.progress!=null?' · '+c.progress+'%':' · No percentage entered'}</span><p>${c.note?esc(c.note):'No note recorded.'}</p>${c.source?`<button class="quiet" data-source="${esc(c.source)}">${esc(c.source)} ↗</button>`:''}</article>`).join('')||`<p class="meta">${g.omitted?'One dated check-in was inspected. Its narrative is omitted from this snapshot.':g.historyUnknown?'History was not inspected.':'No check-ins yet.'}</p>`}</details>
 <details><summary>Connections · ${children.length+(g.parent?1:0)+g.projects.length}</summary>${g.parent?`<div class="connection"><span class="eyebrow">Parent goal</span>${parent?`<button class="quiet" data-jump="${parent.id}">${esc(parent.title)} →</button><span class="meta">${labels[parent.level]} · ${statuses[parent.status]}</span>`:'<p class="meta">Linked parent is unavailable in this view.</p>'}</div>`:'<p class="meta">No parent goal linked.</p>'}${children.map(c=>`<div class="connection"><span class="eyebrow">Linked ${labels[c.level].toLowerCase()} goal</span><button class="quiet" data-jump="${c.id}">${esc(c.title)} →</button><span class="meta">${esc(c.scope)} · ${statuses[c.status]}</span></div>`).join('')}${g.projects.map(p=>`<div class="connection"><span class="eyebrow">Linked project</span><button class="quiet" data-project="${p.id}">${esc(p.title)} ↗</button><span class="meta">${statuses[p.status]}</span></div>`).join('')}${!g.projects.length?`<p class="meta">${g.projectsUnknown?'Project associations were not inspected.':'No projects linked.'}</p>`:''}<p class="meta">Each goal keeps its own recorded status and progress.</p></details>
 <details><summary>Goal description</summary><p>${g.description?esc(g.description):mode==='observed'?'Description omitted or absent in this partial snapshot.':'No description recorded.'}</p></details><div class="row divider"><button class="quiet" data-action="edit">Edit goal</button><button class="meta" data-action="delete" style="margin-left:auto">Delete goal</button></div>`;
 if(editor==='checkin')renderCheckIn(g);
}
function renderCheckIn(g){$('checkinSlot').innerHTML=`<form id="checkinForm" class="inline-form"><h3>Log check-in</h3><div class="formgrid"><label class="field">Status<select name="status">${Object.entries(statuses).map(([k,v])=>`<option value="${k}" ${k===g.status?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Progress % · optional<input name="progress" type="number" min="0" max="100" step="1" placeholder="Leave unchanged"></label></div><label class="field">Update · optional<textarea name="note" placeholder="What changed? What needs a decision?"></textarea></label><p class="help">A blank percentage keeps the last recorded value and its original date.</p><div id="formError" role="alert"></div><div class="form-actions"><button class="primary" type="submit">Save check-in</button><button type="button" data-action="cancel">Cancel</button></div></form>`}
function formValues(){const form=$('goalForm')||$('checkinForm');return form?Object.fromEntries(new FormData(form)):null}
function safeNavigate(fn){if(editor){modal('Leave these edits?',`<p>Unsaved changes will be discarded. Saved check-ins remain in this preview.</p><div class="row"><button class="secondary" data-action="close">Keep editing</button><button class="primary" id="discard">Discard edits</button></div>`);$('discard').onclick=()=>{$('dialog').close();editor=null;fn()};return}fn()}
function choose(id,jump=false){safeNavigate(()=>{selected=id;receipt='';if(jump){level=current().level;filter='all';query='';$('search').value=''}render();if(innerWidth<1121||document.body.classList.contains('compact')){$('focus').scrollIntoView({behavior:'smooth',block:'start'});$('focus').focus({preventScroll:true})}})}
function renderGoalForm(g){const v=g||{title:'',level,scope:level==='company'?'Company':'',status:'active',due:'',description:'',metric:'',parent:''};$('focus').innerHTML=`<div class="eyebrow">${g?'Edit goal':'New goal'}</div><h2>${g?'Goal details.':'An outcome to work toward.'}</h2><form id="goalForm" class="inline-form"><label class="field">Title<input name="title" value="${esc(v.title)}" required maxlength="240"></label><div class="formgrid"><label class="field">Level<select name="level" id="formLevel">${levels.map(l=>`<option value="${l}" ${l===v.level?'selected':''}>${labels[l]}</option>`).join('')}</select></label><label class="field" id="associationLabel">${v.level==='individual'?'Direct report':v.level==='company'?'Scope':labels[v.level]} · optional<select name="scope" id="association"></select></label><label class="field">Status<select name="status">${Object.entries(statuses).map(([k,s])=>`<option value="${k}" ${k===v.status?'selected':''}>${s}</option>`).join('')}</select></label><label class="field">Due date · optional<input name="due" type="date" value="${esc(v.due)}"></label></div><label class="field">Parent goal · optional<select name="parent"><option value="">No parent goal</option>${data.filter(x=>x.id!==g?.id).map(x=>`<option value="${x.id}" ${x.id===v.parent?'selected':''}>${labels[x.level]} · ${esc(x.title)}</option>`).join('')}</select></label><label class="field">Success metric · optional<textarea name="metric" placeholder="How will you know this is done?">${esc(v.metric)}</textarea></label><label class="field">Description · optional<textarea name="description">${esc(v.description)}</textarea></label><button type="button" class="quiet" data-boundary="Text assist">About text assist ↗</button><div id="formError" role="alert"></div><div class="form-actions"><button class="primary" type="submit">${g?'Save changes':'Create goal'}</button><button type="button" data-action="cancel">Cancel</button></div></form>`;association(v.level,v.scope);$('formLevel').onchange=e=>association(e.target.value,'')}
function association(l,value){let choices={individual:['Maya Chen','Sam Rivera'],team:['Customer Success','Support'],department:['Customer Experience'],company:['Company']}[l];$('association').innerHTML=(l==='company'?'':'<option value="">Not linked</option>')+choices.map(c=>`<option ${c===value?'selected':''}>${esc(c)}</option>`).join('');$('associationLabel').firstChild.textContent=(l==='individual'?'Direct report':l==='company'?'Scope':labels[l])+' · optional';$('association').disabled=l==='company'}
function switchMode(next){mode=next;data=structuredClone(next==='observed'?observed:next==='empty'?[]:sample);level='team';filter='all';query='';selected=data.find(g=>g.level===level)?.id||null;editor=null;receipt='';$('dataset').value=mode;$('search').value='';render()}
function saveError(text){$('formError').innerHTML=`<p class="error">${esc(text)}</p>`}
function deletePrompt(){if(!writable())return;const g=current(),children=data.filter(x=>x.parent===g.id);modal('Delete this goal?',`<p><strong>${esc(g.title)}</strong></p><p>This removes the goal and its check-in history from this preview. ${children.length} linked child goal${children.length===1?'':'s'} will remain without this parent. Linked projects remain; their connection to this goal is removed.</p><p class="meta">The prototype resets on refresh. In the application, deletion is permanent.</p><div class="row"><button class="secondary" data-action="close">Cancel</button><button class="danger secondary" id="confirmDelete">Delete goal</button></div>`);$('confirmDelete').onclick=()=>{if(failed()){toast('Couldn’t delete the goal. Nothing changed.');return}data.forEach(x=>{if(x.parent===g.id)x.parent=null});data=data.filter(x=>x.id!==g.id);selected=data.find(matches)?.id||null;receipt='';$('dialog').close();render();toast('Goal removed from this preview.')};}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.boundary){boundary(b.dataset.boundary);return}if(b.dataset.source){modal('Recorded meeting source',`<p>${esc(b.dataset.source)}</p><p>This fictional check-in is linked to a reviewed meeting beyond the team. In the application, this opens that meeting’s saved record.</p>`);return}if(b.dataset.project){const p=data.flatMap(g=>g.projects).find(p=>p.id===b.dataset.project);modal(p.title,'<p>The explicitly linked project opens in the existing Projects workspace. Its status, owner, updates and commitments stay there.</p>');return}if(b.dataset.goal){choose(b.dataset.goal);return}if(b.dataset.jump){choose(b.dataset.jump,true);return}if(b.dataset.level){safeNavigate(()=>{level=b.dataset.level;filter='all';query='';$('search').value='';selected=data.find(g=>g.level===level&&isOpen(g))?.id||data.find(g=>g.level===level)?.id||null;receipt='';render()});return}if(b.dataset.filter){safeNavigate(()=>{filter=b.dataset.filter;render()});return}
const a=b.dataset.action;if(a==='backlist')$('listTitle').scrollIntoView({behavior:'smooth',block:'start'});if(a==='close')$('dialog').close();if(a==='home')safeNavigate(()=>{query='';filter='all';$('search').value='';render()});if(a==='new'&&writable())safeNavigate(()=>{editor='new';receipt='';renderFocus();$('focus').scrollIntoView({behavior:'smooth'});$('goalForm').elements.title.focus({preventScroll:true})});if(a==='checkin'&&writable()){editor='checkin';receipt='';renderFocus();$('checkinForm').elements.note.focus({preventScroll:true})}if(a==='edit'&&writable())safeNavigate(()=>{editor='goal';receipt='';renderFocus()});if(a==='cancel'){editor=null;renderFocus()}if(a==='delete')safeNavigate(()=>deletePrompt());if(a==='history'){$('history').open=!$('history').open;if($('history').open)$('history').scrollIntoView({behavior:'smooth',block:'nearest'})}if(a==='retry'){loading=true;renderList();setTimeout(()=>{loading=false;switchMode('demo');toast('Illustrative records loaded.')},550)}if(a==='directions')modal('Three ways into Goals',`<div class="direction"><span class="chip good">Recommended · Shown in this preview</span><h3 style="margin-top:12px">01 / Goal review</h3><p>A compact list leads to the success metric, dated evidence and a check-in. Best for the recurring question: where does this stand, and where can I help?</p></div><div class="direction"><h3>02 / Alignment map</h3><p>Company → department → team → individual, with projects attached. Strong for understanding connections; less useful when valid goals stand alone. Parent links would remain explicit and optional.</p></div><div class="direction"><h3>03 / People and goals</h3><p>A named person and their outcomes lead. Strong for individual preparation; shared goals don’t have the same person field, and the view overlaps Team.</p></div><p class="meta">The recommendation keeps level filters, borrows connections from the map, and groups individual goals by person.</p>`);
});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target,f=new FormData(form);if(form.id==='checkinForm'){const g=current();if(failed()){saveError('Couldn’t save the check-in. Your entries are still here.');return}const raw=f.get('progress').trim(),p=raw===''?null:Number(raw);if(p!=null&&(!Number.isInteger(p)||p<0||p>100)){saveError('Progress must be a whole number from 0 to 100.');return}g.history.unshift(check(today,f.get('status'),p,f.get('note').trim()));g.status=f.get('status');editor=null;receipt=date(today)+' · '+statuses[g.status]+(p===null?' · No new percentage entered.':' · '+p+'% recorded.')+' '+(f.get('note').trim()?'Update saved.':'No note entered.');render();$('focus').focus({preventScroll:true})}if(form.id==='goalForm'){if(failed()){saveError('Couldn’t save the goal. Your edits are still here.');return}const name=f.get('title').trim();if(!name){saveError('Enter a goal title.');return}const l=f.get('level'),parent=f.get('parent')||null,g=current();if(parent&&editor==='goal'){let next=parent,seen=new Set();while(next&&!seen.has(next)){if(next===g.id){saveError('A goal cannot be its own ancestor. Choose another parent.');return}seen.add(next);next=data.find(x=>x.id===next)?.parent}}
 const values={title:name,level:l,scope:l==='company'?'Company':f.get('scope')||(l==='individual'?'Not linked to a report':'No '+l+' linked'),parent,status:f.get('status'),due:f.get('due'),metric:f.get('metric'),description:f.get('description')};if(editor==='new'){const added={id:'new'+Date.now(),...values,projects:[],history:[]};data.push(added);selected=added.id}else Object.assign(g,values);level=l;filter='all';query='';$('search').value='';editor=null;receipt='';render();toast('Goal saved in this preview.')}});
document.addEventListener('change',e=>{if(e.target.id==='status'){if(!writable()){e.target.value=current().status;return}const nextStatus=e.target.value;e.target.value=current().status;safeNavigate(()=>{if(failed()){toast('Couldn’t change status. The recorded status is unchanged.');return}current().status=nextStatus;receipt='';render();toast('Status changed. No check-in or new percentage was added.');});}});
$('dataset').onchange=e=>{const next=e.target.value;safeNavigate(()=>switchMode(next));$('dataset').value=mode};$('search').oninput=e=>{query=e.target.value;renderList();};$('compact').onclick=()=>{document.body.classList.toggle('compact');$('compact').setAttribute('aria-pressed',document.body.classList.contains('compact'))};render();
})();
</script></body></html>
