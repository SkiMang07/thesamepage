<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>First Run Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#F5F8FA;--surface:#FFFFFF;--sunken:#ECEFF2;--hairline:#DDE0E3;--control:#C9CDD0;
  --ink:#222B32;--ink-body:#394148;--ink-secondary:#4F575D;--ink-muted:#686E74;--ink-faint:#878D92;
  --brand:#087E78;--brand-hover:#00635F;--brand-tint:#EEF5F4;--teal-300:#B1D5D1;
  --carbon:#222B32;--carbon-deep:#131B22;--on-carbon:#A7ACB0;--amber:#B67118;--amber-tint:#FBF1E0;--focus:#2878D0;
  --shadow-paper:0 1px 1px rgba(34,43,50,.05),0 2px 6px -2px rgba(34,43,50,.06),0 28px 44px -30px rgba(34,43,50,.38);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- prototype bar (not part of the design) ---------- */
.pbar{position:sticky;top:0;z-index:50;background:var(--carbon-deep);color:#fff;font:500 12px/1 var(--mono);display:flex;align-items:center;gap:14px;padding:9px 16px;flex-wrap:wrap}
.pbar b{letter-spacing:.08em;text-transform:uppercase;color:var(--teal-300);font-weight:500}
.pbar .seg{display:flex;border:1px solid #3A444C;border-radius:4px;overflow:hidden}
.pbar .seg button{background:none;border:0;color:var(--on-carbon);padding:6px 10px;font:inherit}
.pbar .seg button[aria-pressed=true]{background:#fff;color:var(--ink)}
.pbar .steps{display:flex;gap:4px}
.pbar .steps button{width:24px;height:24px;border-radius:3px;border:1px solid #3A444C;background:none;color:var(--on-carbon);font:inherit;padding:0}
.pbar .steps button[aria-current=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.pbar .sp{flex:1}
.pbar .ghost{background:none;border:1px solid #3A444C;color:var(--on-carbon);border-radius:4px;padding:6px 10px}

/* ---------- stage ---------- */
.stage{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);min-height:calc(100vh - 42px)}
.ask{display:flex;flex-direction:column;padding:32px clamp(24px,5vw,72px) 28px;min-width:0}
@media (min-width:901px){.ask{position:sticky;top:42px;height:calc(100vh - 42px);align-self:start}}
.mark{display:flex;align-items:center;gap:10px;font:500 15px/1 var(--sans);color:var(--ink);letter-spacing:-.01em}
.mark i{width:22px;height:22px;border-radius:5px;background:var(--brand);position:relative;display:inline-block}
.mark i::after{content:"";position:absolute;left:6px;top:5px;width:10px;height:12px;border-radius:1.5px;background:#fff;box-shadow:inset 2px 0 0 var(--teal-300)}
.ask-body{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:520px;padding:40px 0}
.eyebrow{font:500 12px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin:0 0 20px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,3.6vw,52px);line-height:1.04;letter-spacing:-.02em;margin:0 0 14px;color:var(--ink)}
.lede{font-size:17px;line-height:1.55;color:var(--ink-secondary);margin:0 0 28px;max-width:44ch}
.field{display:block;margin:0 0 22px}
.field .lbl{display:block;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:10px}
.line-input{width:100%;border:0;border-bottom:1.5px solid var(--control);background:transparent;font:400 30px/1.2 var(--serif);color:var(--ink);padding:6px 0 10px;border-radius:0}
.line-input::placeholder{color:#B5BABE}
.line-input:focus{outline:none;border-bottom-color:var(--brand)}
textarea.box{width:100%;min-height:150px;border:1px solid var(--control);border-radius:3px;background:var(--surface);font:400 19px/1.6 var(--serif);color:var(--ink);padding:14px 16px;resize:vertical;background-image:repeating-linear-gradient(transparent 0 29.4px,#EEF1F3 29.4px 30.4px);background-attachment:local;background-position:0 14px}
textarea.box.small{min-height:96px;font-size:17px}
textarea.box:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--control);background:var(--surface);border-radius:999px;padding:8px 14px;font:500 13px/1 var(--sans);color:var(--ink-body)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.actions{display:flex;align-items:center;gap:18px;margin-top:8px;flex-wrap:wrap}
.btn{background:var(--brand);color:#fff;border:0;border-radius:4px;padding:14px 22px;font:600 15px/1 var(--sans);display:inline-flex;align-items:center;gap:10px;min-height:48px}
.btn:hover{background:var(--brand-hover)}
.btn[disabled]{background:var(--control);cursor:default}
.btn kbd{font:500 11px/1 var(--mono);border:1px solid rgba(255,255,255,.45);border-radius:3px;padding:3px 5px;opacity:.9}
.link{background:none;border:0;color:var(--ink-muted);font:500 15px/1 var(--sans);padding:12px 4px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--control)}
.hint{font-size:14px;color:var(--ink-muted);margin:12px 0 0;min-height:20px}
.ask-foot{display:flex;justify-content:space-between;gap:16px;font-size:13px;color:var(--ink-muted);border-top:1px solid var(--hairline);padding-top:16px}
.ask-foot a{color:var(--ink-muted);white-space:nowrap}
.fade-in{animation:fadeUp .45s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- desk ---------- */
.desk{position:relative;background:#EBEFF2;border-left:1px solid var(--hairline);overflow:hidden;min-height:620px;display:flex}
.desk::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 70% 0%,rgba(255,255,255,.55),transparent 60%)}
.desk-inner{position:relative;flex:1;display:flex;padding:110px 48px 90px}
.stack{position:relative;width:min(460px,80%);margin:auto}
.stack.wide{width:min(560px,86%)}

.paper{position:absolute;background:var(--surface);border-radius:3px;box-shadow:var(--shadow-paper);transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .5s ease,top .6s cubic-bezier(.2,.8,.2,1);}
.paper::before{content:"";position:absolute;top:0;bottom:0;left:44px;width:1.5px;background:var(--teal-300)}
.paper .pad{padding:34px 36px 34px 68px}

/* Andrew's note */
.note{position:relative;width:min(400px,100%);margin:0 auto;transform:rotate(-1.5deg)}
.note .pad{padding:30px 30px 28px 64px}
.note p{font:400 18px/1.5 var(--serif);color:var(--ink-body);margin:0 0 12px}
.note .sig{font:italic 400 22px/1 var(--serif);color:var(--ink);margin:16px 0 4px}
.note .who{font:500 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.note .draft{position:absolute;top:-11px;right:14px;background:var(--amber-tint);color:#7A4A0E;font:500 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 7px;border-radius:3px}
.note.tucked{position:absolute;top:300px;left:-210px;width:340px;transform:rotate(-5deg) scale(.86)}

/* A: a page per person */
.person{position:relative;width:100%;min-height:520px}
.person.enter{opacity:0;transform:translateY(40px) rotate(1deg)}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font:500 16px/1 var(--sans);color:#fff;flex:none}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:18px;border-bottom:1.5px solid var(--ink)}
.pname{font:400 36px/1.05 var(--serif);letter-spacing:-.02em;color:var(--ink);word-break:break-word}
.pname.empty{color:#C4C9CD}
.pmeta{margin-top:10px;font:500 12px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.pmeta .on{color:var(--brand)}
.k{margin:22px 0 6px;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);display:flex;justify-content:space-between;gap:12px}
.k .ai{color:var(--brand);text-transform:none;letter-spacing:0;font-size:11px}
.rule{height:31px;border-bottom:1px solid #EEF1F3}
.mynote{font:400 17px/1.55 var(--serif);color:var(--ink-body);white-space:pre-wrap;padding:6px 0;border-bottom:1px solid #EEF1F3}
.summary{font:italic 400 17px/1.5 var(--serif);color:var(--ink-secondary);margin:8px 0 4px}
.ag{list-style:none;margin:0;padding:0;counter-reset:ag}
.ag li{counter-increment:ag;padding:12px 0 12px 30px;border-bottom:1px solid #EEF1F3;position:relative;opacity:0;transform:translateY(6px);transition:opacity .4s ease,transform .4s ease}
.ag li.shown{opacity:1;transform:none}
.ag li::before{content:counter(ag,decimal-leading-zero);position:absolute;left:0;top:14px;font:500 11px/1 var(--mono);color:var(--brand)}
.ag .t{font:500 16px/1.35 var(--sans);color:var(--ink);outline:none}
.ag .q{font:400 16px/1.45 var(--serif);color:var(--ink-body);margin-top:4px;outline:none}
.ag [contenteditable]:hover{background:var(--brand-tint)}
.ag [contenteditable]:focus{background:var(--brand-tint);box-shadow:0 0 0 3px var(--brand-tint)}
.caret{display:inline-block;width:2px;height:1em;background:var(--brand);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.stamp{position:absolute;right:26px;bottom:26px;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--brand);border:1.5px solid var(--brand);padding:7px 9px;border-radius:3px;transform:rotate(-4deg);opacity:0;transition:opacity .4s ease .2s}
.stamp.on{opacity:1}

/* stacked sheets behind (tabs) */
.behind{left:0;top:0;width:100%;height:520px}
.behind .tab{position:absolute;top:-30px;height:30px;padding:0 14px;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:3px 3px 0 0;font:500 12px/1 var(--mono);color:var(--ink-secondary);box-shadow:0 -1px 2px rgba(34,43,50,.05);white-space:nowrap}
.behind .tab i{width:8px;height:8px;border-radius:50%;display:inline-block}
.count{position:absolute;left:48px;top:40px;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);z-index:5}

/* B: the contents page */
.contents{position:relative;width:100%;min-height:560px}
.ctitle{font:400 40px/1 var(--serif);letter-spacing:-.02em;margin:0}
.csub{font:500 12px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin:10px 0 18px;padding-bottom:16px;border-bottom:1.5px solid var(--ink)}
.cl{list-style:none;margin:0;padding:0}
.cl > li{border-bottom:1px solid var(--hairline);animation:fadeUp .4s ease both}
.crow{display:flex;align-items:baseline;gap:10px;padding:14px 12px 14px 0;position:relative}
.crow .nm{font:400 22px/1.2 var(--serif);color:var(--ink);white-space:nowrap}
.crow .dots{flex:1;border-bottom:1.5px dotted var(--control);transform:translateY(-4px);min-width:20px}
.crow .val{font:500 12px/1 var(--mono);letter-spacing:.04em;color:var(--ink-muted);white-space:nowrap}
.crow .val.on{color:var(--brand)}
.cl > li.sel{background:linear-gradient(90deg,var(--brand-tint),rgba(238,245,244,.3))}
.cl > li.sel .crow{padding-left:14px}
.cl > li.sel .crow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.cl .ghostrow .nm{color:#C4C9CD}
.expand{padding:0 14px 18px 14px;background:var(--surface);border-left:3px solid var(--brand)}
.clip{position:absolute;top:-18px;right:34px;width:min(230px,50%);transform:rotate(3deg);background:#FFFDF7;border-radius:2px;box-shadow:0 1px 2px rgba(34,43,50,.08),0 12px 22px -14px rgba(34,43,50,.35);padding:16px 16px 14px;z-index:3;transition:transform .5s ease,opacity .4s ease}
.clip p{font:400 14px/1.45 var(--serif);color:var(--ink-body);margin:0 0 6px}
.clip .sig{font:italic 400 16px/1 var(--serif);color:var(--ink);margin-top:8px}
.clip::before{content:"";position:absolute;top:-10px;left:22px;width:12px;height:30px;border:2px solid #9BA3A8;border-radius:6px}
.clip .draft{position:absolute;bottom:-10px;right:10px;background:var(--amber-tint);color:#7A4A0E;font:500 9px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:3px}
.clip.away{transform:rotate(8deg) translate(40px,-30px);opacity:0;pointer-events:none}

/* ---------- Mission Control handoff (dark app) ---------- */
.mc{position:fixed;inset:42px 0 0 0;background:var(--carbon-deep);color:#E6EAEC;z-index:40;display:none;overflow:auto}
.mc.on{display:block;animation:lights .7s ease both}
@keyframes lights{from{opacity:0}to{opacity:1}}
.mc-wrap{max-width:1040px;margin:0 auto;padding:40px 24px 60px;display:grid;grid-template-columns:200px 1fr;gap:40px}
.mc-nav{font:500 14px/1 var(--sans);color:var(--on-carbon);display:flex;flex-direction:column;gap:4px}
.mc-nav span{padding:10px 12px;border-radius:4px}
.mc-nav span.on{background:#1D2429;color:#fff}
.mc h2{font:400 34px/1.1 var(--serif);color:#fff;margin:6px 0 10px;letter-spacing:-.01em}
.mc .date{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--teal-300)}
.mc .morning{font:400 19px/1.5 var(--serif);color:#D5DADE;max-width:60ch;margin:0 0 28px}
.mc .card{background:#1B232A;border:1px solid #2B343B;border-radius:6px;padding:18px 20px;margin-bottom:12px}
.mc .card .h{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--on-carbon);margin-bottom:12px}
.mc .row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #2B343B}
.mc .row:first-of-type{border-top:0}
.mc .row .n{flex:1;font-size:15px;color:#fff}
.mc .row .s{font:500 12px/1 var(--mono);color:var(--on-carbon)}
.mc .row .s.ok{color:#6FC7BE}
.mc .row .av{width:30px;height:30px;font-size:12px}
.mc .back{margin-top:24px;background:none;border:1px solid #3A444C;color:var(--on-carbon);border-radius:4px;padding:10px 14px}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .stage{grid-template-columns:1fr}
  .ask{padding:22px 16px 20px}
  .ask-body{padding:28px 0 20px}
  .desk{min-height:0;border-left:0;border-top:1px solid var(--hairline)}
  .desk{display:block}
  .desk-inner{padding:48px 16px 40px;display:block}
  .stack,.stack.wide{width:auto}
  .paper{position:relative}
  .note{width:auto;transform:rotate(-1deg)}
  .note.tucked{display:none}
  .person,.contents{width:auto;min-height:0}
  .person.enter{transform:translateY(20px)}
  .behind{display:none}
  .count{position:static;display:block;margin:0 0 14px}
  .note{transform:rotate(-1deg)}
  .paper .pad{padding:26px 20px 26px 44px}
  .paper::before{left:26px}
  .clip{position:relative;top:auto;right:auto;width:auto;margin:0 0 22px;transform:rotate(-1deg)}
  .clip.away{display:none}
  .pname{font-size:30px}
  .mc-wrap{grid-template-columns:1fr;gap:20px}
  .mc-nav{flex-direction:row;overflow:auto}
  .stage[data-step="4"] .desk,.stage[data-step="5"] .desk{order:-1;border-top:0;border-bottom:1px solid var(--hairline)}
  .btn kbd{display:none}
  .crow{flex-wrap:wrap}
  .crow .dots{display:none}
  .crow .val{flex-basis:100%;padding-left:36px;margin-top:4px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ag li{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="pbar" role="region" aria-label="Prototype controls">
  <b>Prototype · First run</b>
  <div class="seg" role="group" aria-label="Direction">
    <button id="dirA" aria-pressed="true">A · A page per person</button>
    <button id="dirB" aria-pressed="false">B · One contents page</button>
  </div>
  <div class="steps" id="stepJump" aria-label="Jump to step"></div>
  <span class="sp"></span>
  <button class="ghost" id="restart">Restart</button>
</div>

<main class="stage">
  <section class="ask">
    <div class="mark"><i aria-hidden="true"></i>The Same Page</div>
    <div class="ask-body" id="ask" aria-live="polite"></div>
    <div class="ask-foot">
      <span>Only you can see what you write here. Nothing is shared with the people you add.</span>
      <a href="#" onclick="return false">Sign out</a>
    </div>
  </section>
  <section class="desk" aria-label="Preview of your pages">
    <div class="desk-inner" id="desk"></div>
  </section>
</main>

<div class="mc" id="mc" aria-hidden="true"></div>

<script>
/* ---------------- state ---------------- */
const TOP = ['#7E6A94','#4F6D7A','#6F7F55','#A8665A','#5A6190','#3D4A56','#B89B72'];
const FOUNDING_N = 7;
const today = new Date();
const oneYear = new Date(today); oneYear.setFullYear(today.getFullYear()+1);
const fmtLong = d => d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const fmtShort = d => d.toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short'});
const fmtDay = d => d.toLocaleDateString('en-US',{weekday:'long'});

function nextWeekdays(n){
  const out=[]; const d=new Date(today);
  while(out.length<n){ d.setDate(d.getDate()+1); if(d.getDay()!==0&&d.getDay()!==6) out.push(new Date(d)); }
  return out;
}
const DAYS = nextWeekdays(4);

let S;
function reset(){
  S = {dir:S?S.dir:'A', step:1, name:'', dateIdx:null, rosterText:'', notes:'', agenda:null, written:0, saved:false};
}
reset();

const first = n => (n||'').trim().split(/\s+/)[0] || '';
const initials = n => (n||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function roster(){
  const seen=new Set([S.name.trim().toLowerCase()]);
  return S.rosterText.split(/[\n,]/).map(s=>s.replace(/^\s*([-•*]|\d+[.)])\s*/,'').trim()).filter(s=>{
    const k=s.toLowerCase(); if(!s||seen.has(k)) return false; seen.add(k); return true;
  }).slice(0,25);
}
const dateLabel = () => S.dateIdx===null ? null : fmtShort(DAYS[S.dateIdx]);

/* ---------------- the agenda (what the first-1:1 prompt branch would return) ---------------- */
function buildAgenda(){
  const f = first(S.name);
  const items = [
    {t:`How ${f} likes to work`, q:`How do you like to get feedback: in the moment, or saved for these 1:1s? What's the best way to reach you when something's urgent?`},
    {t:`What's on ${f}'s plate right now`, q:`What's taking most of your week? Where are you stuck, or waiting on someone?`},
    {t:`What ${f} wants from the role`, q:`What would make the next six months a good stretch for you? What would you like to be doing more of?`},
    {t:`How you'll run these 1:1s`, q:`How often should we meet, and what should this time be for? What should I bring each time?`},
    {t:`Close`, q:`Is there anything on your mind we haven't covered?`}
  ];
  if (S.notes.trim()){
    const line = S.notes.trim().split('\n')[0].slice(0,140).replace(/[.\s]+$/,'');
    items.splice(1,0,{t:`From your notes`, q:`You wrote: "${line}". Ask ${f} how it looks from their side.`});
  }
  const summary = S.notes.trim()
    ? `First recorded 1:1 with ${f}. The only thing on record is your note, so most of this is about how the two of you will work together.`
    : `First recorded 1:1 with ${f}. Nothing else is on record yet, so this agenda is about how the two of you will work together.`;
  return {summary, items};
}

/* ---------------- left column ---------------- */
const ask = document.getElementById('ask');
function renderAsk(){
  const f = first(S.name) || 'them';
  let h='';
  if (S.step===1){
    h = `
      <p class="eyebrow">Founding manager ${FOUNDING_N} of 20 · Free until ${fmtLong(oneYear)}</p>
      <h1>Who's your next 1:1 with?</h1>
      <label class="field"><span class="lbl">Name</span>
        <input class="line-input" id="nameIn" autocomplete="off" placeholder="Priya Patel" value="${esc(S.name)}"></label>
      <div class="field"><span class="lbl">When <span style="text-transform:none;letter-spacing:0;color:var(--ink-faint)">· optional</span></span>
        <div class="chips">${DAYS.map((d,i)=>`<button class="chip" data-d="${i}" aria-pressed="${S.dateIdx===i}">${fmtShort(d)}</button>`).join('')}
        <button class="chip" data-d="x" aria-pressed="false">Other date</button></div></div>
      <div class="actions"><button class="btn" id="go" ${S.name.trim()?'':'disabled'}>Continue <kbd>↵</kbd></button></div>`;
  }
  if (S.step===2){
    const r = roster();
    h = `
      <h1>Who else do you have 1:1s with?</h1>
      <p class="lede">One name per line. Roles and teams can come later.</p>
      <textarea class="box" id="rosterIn" placeholder="Sam Okafor&#10;Lena Ruiz&#10;Theo Marsh">${esc(S.rosterText)}</textarea>
      <div class="actions" style="margin-top:22px"><button class="btn" id="go">${r.length?`Add ${r.length} and continue`:'Continue'} <kbd>⌘↵</kbd></button>
      <button class="link" id="skip">Skip</button></div>`;
  }
  if (S.step===3){
    h = `
      <p class="eyebrow">${dateLabel()?`1:1 · ${dateLabel()}`:'Next 1:1'}</p>
      <h1>Your first 1:1 with ${esc(f)}.</h1>
      <p class="lede">Nothing is on record yet, so the agenda starts with how you'll work together.</p>
      <label class="field"><span class="lbl">Anything you already know about ${esc(f)}'s work <span style="text-transform:none;letter-spacing:0;color:var(--ink-faint)">· optional</span></span>
        <textarea class="box small" id="notesIn" placeholder="Just moved over from support. Owns the Brightline renewal.">${esc(S.notes)}</textarea></label>
      <div class="actions"><button class="btn" id="go">Build the agenda <kbd>⌘↵</kbd></button></div>`;
  }
  if (S.step===4){
    h = `
      <h1>${esc(f)}'s first agenda.</h1>
      <p class="lede">Drafted from what you wrote. Click any line to change it. Nothing is saved until you save it.</p>
      <div class="actions"><button class="btn" id="go" ${S.written<S.agenda.items.length?'disabled':''}>Save to ${esc(f)}'s page <kbd>⌘↵</kbd></button>
      <button class="link" id="redo">Build it again</button></div>
      <p class="hint" id="hint">${S.written<S.agenda.items.length?'Writing…':''}</p>`;
  }
  if (S.step===5){
    const r = roster();
    const others = r.length ? `${listNames(r.map(first))} ${r.length===1?'is':'are'} on your team too, with no 1:1 set yet.` : `Add the rest of your team whenever you like.`;
    h = `
      <p class="eyebrow">Saved</p>
      <h1>Ready for ${dateLabel()?fmtDay(DAYS[S.dateIdx]):'your 1:1'}.</h1>
      <p class="lede">The agenda is on ${esc(f)}'s page. ${esc(others)}</p>
      <div class="actions"><button class="btn" id="go">Open Mission Control <kbd>↵</kbd></button></div>`;
  }
  ask.innerHTML = `<div class="fade-in">${h}</div>`;
  wireAsk();
}
function listNames(a){ if(a.length<=1) return a.join(''); if(a.length===2) return a.join(' and '); if(a.length<=4) return a.slice(0,-1).join(', ')+' and '+a[a.length-1]; return `${a.slice(0,3).join(', ')} and ${a.length-3} more`; }

function wireAsk(){
  const go = document.getElementById('go');
  if (S.step===1){
    const inp=document.getElementById('nameIn');
    inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length);
    inp.addEventListener('input',()=>{S.name=inp.value; go.disabled=!S.name.trim(); renderDesk();});
    ask.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
      const d=c.dataset.d; if(d==='x') return; S.dateIdx = S.dateIdx===+d?null:+d;
      ask.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.d==String(S.dateIdx))));
      renderDesk();
    }));
  }
  if (S.step===2){
    const ta=document.getElementById('rosterIn'); ta.focus();
    ta.addEventListener('input',()=>{S.rosterText=ta.value; const n=roster().length; go.innerHTML=(n?`Add ${n} and continue`:'Continue')+' <kbd>⌘↵</kbd>'; renderDesk();});
    ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)) next();});
    document.getElementById('skip').onclick=()=>{S.rosterText=''; next();};
  }
  if (S.step===3){
    const ta=document.getElementById('notesIn'); ta.focus();
    ta.addEventListener('input',()=>{S.notes=ta.value; renderDesk();});
    ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)) next();});
  }
  if (S.step===4){
    document.getElementById('redo').onclick=()=>{S.step=3; S.agenda=null; S.written=0; renderAll();};
  }
  if (go) go.onclick = next;
}

function next(){
  if (S.step===1 && !S.name.trim()) return;
  if (S.step===3){ S.agenda=buildAgenda(); S.written=0; S.step=4; renderAll(); writeAgenda(); return; }
  if (S.step===4){ if(S.written<S.agenda.items.length) return; captureEdits(); S.saved=true; S.step=5; renderAll(); return; }
  if (S.step===5){ openMC(); return; }
  S.step++; renderAll();
}
document.addEventListener('keydown',e=>{
  if(S.step===1 && e.key==='Enter' && S.name.trim()){ e.preventDefault(); next(); return; }
  if(S.step===4 && e.key==='Enter' && (e.metaKey||e.ctrlKey)) next();
  if(S.step===5 && e.key==='Enter' && !document.getElementById('mc').classList.contains('on')) next();
});

/* the agenda "writes itself": one item at a time, as the real call would stream in */
let writeTimer=null;
function writeAgenda(){
  clearTimeout(writeTimer);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const step = () => {
    if (S.step!==4) return;
    S.written++;
    const li = document.querySelectorAll('.ag li')[S.written-1];
    if (li) li.classList.add('shown');
    if (S.written < S.agenda.items.length) writeTimer=setTimeout(step, reduce?0:520);
    else { const go=document.getElementById('go'); if(go) go.disabled=false; const h=document.getElementById('hint'); if(h) h.textContent=''; const c=document.querySelector('.caret'); if(c) c.remove(); }
  };
  writeTimer=setTimeout(step, reduce?0:900);
}
function captureEdits(){
  document.querySelectorAll('.ag li').forEach((li,i)=>{
    const t=li.querySelector('.t'), q=li.querySelector('.q');
    if(S.agenda.items[i]){ S.agenda.items[i].t=t.textContent; S.agenda.items[i].q=q.textContent; }
  });
}

/* ---------------- right column: the desk ---------------- */
const desk = document.getElementById('desk');
let lastDeskStep = 0;
function avatar(name,i,size){ return `<span class="av" style="background:${TOP[i%TOP.length]}${size?`;width:${size}px;height:${size}px;font-size:${Math.round(size/3)}px`:''}">${esc(initials(name))||'·'}</span>`; }

function noteA(tucked){
  return `<div class="paper note ${tucked?'tucked':''}" style="z-index:1"><span class="draft">Draft · Andrew's words</span><div class="pad">
    <p>I'm Andrew. I kept a Google Doc for every person on my team for years, and it held up until about seven people.</p>
    <p>This is what I built instead. You're one of the first twenty in, and it's free for your first year. If something's off, write to me.</p>
    <p class="sig">Andrew</p><p class="who">AG@thesamepage.xyz</p></div></div>`;
}

function agendaHTML(){
  if (!S.agenda) return '';
  const writing = S.step===4 && S.written < S.agenda.items.length;
  return `
    <div class="k"><span>Agenda</span><span class="ai">Drafted by AI · you review before it saves</span></div>
    <p class="summary">${esc(S.agenda.summary)}${writing?'<span class="caret"></span>':''}</p>
    <ol class="ag">${S.agenda.items.map((it,i)=>`<li class="${i<S.written?'shown':''}"><div class="t" ${S.step===4?'contenteditable="true" spellcheck="false"':''}>${esc(it.t)}</div><div class="q" ${S.step===4?'contenteditable="true" spellcheck="false"':''}>${esc(it.q)}</div></li>`).join('')}</ol>`;
}

function personPage(){
  const f=first(S.name);
  const meta = dateLabel() ? `<span class="on">1:1 · ${dateLabel()}</span>` : (S.name.trim()?'No 1:1 date yet':'&nbsp;');
  let body='';
  if (S.step<=2){
    body = `<div class="k"><span>Next 1:1</span></div>${'<div class="rule"></div>'.repeat(3)}<div class="k"><span>Agreed</span></div>${'<div class="rule"></div>'.repeat(2)}`;
  } else if (S.step===3){
    body = `<div class="k"><span>Your notes</span></div>${S.notes.trim()?`<div class="mynote">${esc(S.notes)}</div>`:'<div class="rule"></div><div class="rule"></div>'}<div class="k"><span>Agenda</span></div>${'<div class="rule"></div>'.repeat(4)}`;
  } else {
    body = (S.notes.trim()?`<div class="k"><span>Your notes</span></div><div class="mynote">${esc(S.notes)}</div>`:'') + agendaHTML();
  }
  return `<div class="ph"><div><div class="pname ${S.name.trim()?'':'empty'}">${esc(S.name.trim()||'Their name')}</div><div class="pmeta">${meta}</div></div>${S.name.trim()?avatar(S.name,0):''}</div>${body}
    <div class="stamp ${S.step===5?'on':''}">Prep ready</div>`;
}

function renderDeskA(){
  const r = roster();
  const showPerson = S.name.trim() || S.step>1;
  let h = noteA(showPerson);
  let count = (r.length && S.step>=2) ? `<div class="count">${r.length+1} people · ${r.length+1} pages</div>` : '';
  // sheets behind Priya's, each with a name tab
  const behind = r.slice(0,6).map((n,i)=>{
    const off = (i+1)*14;
    return `<div class="paper behind" style="z-index:${2+ (6-i)};transform:translate(${off}px,${-off}px) rotate(${(i%2?1:-1)*0.6}deg)">
      <span class="tab" style="left:${58+i*112}px">${`<i style="background:${TOP[(i+1)%TOP.length]}"></i>`}${esc(n)}</span></div>`;
  }).reverse().join('');
  h += behind;
  if (showPerson){
    h += `<div class="paper person ${lastDeskStep===0&&S.step===1&&S.name.length===1?'enter':''}" id="pp" style="z-index:20;${S.step>=4?'':''}"><div class="pad">${personPage()}</div></div>`;
  }
  desk.innerHTML = count + `<div class="stack">${h}</div>`;
  const pp=document.getElementById('pp'); if(pp&&pp.classList.contains('enter')) requestAnimationFrame(()=>requestAnimationFrame(()=>pp.classList.remove('enter')));
}

function renderDeskB(){
  const r = roster(); const f=first(S.name);
  const firstVal = S.step>=5 ? `<span class="val on">Prep ready · ${dateLabel()||'no date'}</span>` : (dateLabel()?`<span class="val on">1:1 · ${dateLabel()}</span>`:`<span class="val">${S.name.trim()?'No date yet':''}</span>`);
  let rows = `<li class="${S.name.trim()?'sel':'ghostrow'}"><div class="crow">${S.name.trim()?avatar(S.name,0,26):''}<span class="nm">${esc(S.name.trim()||'Your next 1:1')}</span><span class="dots"></span>${firstVal}</div>`;
  if (S.step>=3){
    let inner='';
    if (S.step===3) inner = `<div class="k"><span>Your notes</span></div>${S.notes.trim()?`<div class="mynote">${esc(S.notes)}</div>`:'<div class="rule"></div>'}<div class="k"><span>Agenda</span></div><div class="rule"></div><div class="rule"></div>`;
    else inner = (S.notes.trim()?`<div class="k"><span>Your notes</span></div><div class="mynote">${esc(S.notes)}</div>`:'') + agendaHTML();
    rows += `<div class="expand">${inner}</div>`;
  }
  rows += `</li>`;
  rows += r.map((n,i)=>`<li><div class="crow">${avatar(n,i+1,26)}<span class="nm">${esc(n)}</span><span class="dots"></span><span class="val">No 1:1 set</span></div></li>`).join('');
  if (S.step<=2 && S.step===2) rows += `<li class="ghostrow"><div class="crow"><span class="nm">…</span><span class="dots"></span><span class="val"></span></div></li>`;
  const clipAway = S.step>=3;
  desk.innerHTML = `<div class="stack wide"><div class="paper contents" style="z-index:2"><div class="clip ${clipAway?'away':''}"><span class="draft">Draft</span>
      <p>You're one of the first twenty managers in. It's free for your first year. If anything's off, write to me.</p><p class="sig">Andrew · AG@thesamepage.xyz</p></div>
    <div class="pad"><h2 class="ctitle">Your team</h2>
    <p class="csub">${r.length||S.name.trim() ? `${(S.name.trim()?1:0)+r.length} ${((S.name.trim()?1:0)+r.length)===1?'person':'people'}` : 'Contents'}${S.step>=5?' · 1 prepped':''}</p>
    <ul class="cl">${rows}</ul></div></div></div>`;
}

function renderDesk(){
  // keep in-progress agenda edits when re-rendering
  if (S.dir==='A') renderDeskA(); else renderDeskB();
  lastDeskStep = S.step;
}

/* ---------------- Mission Control handoff ---------------- */
function openMC(){
  const r = roster(); const f=first(S.name);
  const when = dateLabel()?fmtDay(DAYS[S.dateIdx]):'your next 1:1';
  const morning = r.length
    ? `One 1:1 on the calendar, with ${f} on ${when}, and it's prepped. ${r.length===1?first(r[0])+' has':(['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten'][r.length]||r.length)+' people have'} no 1:1 set yet.`
    : `One 1:1 on the calendar, with ${f} on ${when}, and it's prepped.`;
  const mc=document.getElementById('mc');
  mc.innerHTML = `<div class="mc-wrap"><nav class="mc-nav"><span class="on">Mission Control</span><span>Team</span><span>1:1s</span><span>Goals</span><span>Projects</span><span>Knowledge</span><span>Beyond the team</span><span>Settings</span></nav>
    <div><p class="date">${today.toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long'})}</p><h2>Mission Control</h2>
    <p class="morning">${esc(morning)}</p>
    <div class="card"><div class="h">Coming up</div>
      <div class="row">${avatar(S.name,0)}<span class="n">1:1 with ${esc(S.name.trim())}</span><span class="s ok">${dateLabel()?esc(dateLabel())+' · ':''}Prep ready</span></div></div>
    ${r.length?`<div class="card"><div class="h">No 1:1 set</div>${r.map((n,i)=>`<div class="row">${avatar(n,i+1)}<span class="n">${esc(n)}</span><span class="s">Set a date</span></div>`).join('')}</div>`:''}
    <p style="font-size:13px;color:var(--on-carbon);margin-top:18px">Stand-in for the real Mission Control, to show the handoff into the dark app. The line above is the B3 morning line on day one.</p>
    <button class="back" id="mcBack">Back to the prototype</button></div></div>`;
  mc.classList.add('on'); mc.setAttribute('aria-hidden','false');
  document.getElementById('mcBack').onclick=()=>{mc.classList.remove('on'); mc.setAttribute('aria-hidden','true');};
}

/* ---------------- controls ---------------- */
function renderJump(){
  const labels=['Name','Team','Notes','Agenda','Done'];
  document.getElementById('stepJump').innerHTML = labels.map((l,i)=>`<button title="${l}" aria-current="${S.step===i+1}" data-s="${i+1}">${i+1}</button>`).join('');
  document.querySelectorAll('#stepJump button').forEach(b=>b.onclick=()=>jump(+b.dataset.s));
}
function jump(s){
  if (!S.name.trim()) { S.name='Priya Patel'; S.dateIdx=1; }
  if (s>=3 && !S.rosterText) S.rosterText='Sam Okafor\nLena Ruiz\nTheo Marsh';
  if (s>=4) { S.agenda = S.agenda || buildAgenda(); S.written = S.agenda.items.length; }
  if (s<4) { S.agenda=null; S.written=0; }
  S.saved = s>=5; S.step=s; renderAll();
}
function renderAll(){ document.querySelector('.stage').dataset.step=S.step; renderJump(); renderAsk(); renderDesk(); if(matchMedia('(max-width:900px)').matches && S.step>=4) scrollTo(0,0); }

document.getElementById('dirA').onclick=()=>{ if(S.step===4) captureEdits(); S.dir='A'; setDir(); };
document.getElementById('dirB').onclick=()=>{ if(S.step===4) captureEdits(); S.dir='B'; setDir(); };
function setDir(){ document.getElementById('dirA').setAttribute('aria-pressed',S.dir==='A'); document.getElementById('dirB').setAttribute('aria-pressed',S.dir==='B'); renderDesk(); }
document.getElementById('restart').onclick=()=>{ clearTimeout(writeTimer); document.getElementById('mc').classList.remove('on'); reset(); renderAll(); };

const q = new URLSearchParams(location.search);
if (q.get('dir')==='B') S.dir='B';
setDir();
if (q.get('step')) jump(+q.get('step')); else renderAll();
</script>
</body>
</html>
