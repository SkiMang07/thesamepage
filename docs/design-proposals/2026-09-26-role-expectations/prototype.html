  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    &quot;message&quot;,
    (event) =&gt; {

        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||

        ports.length !== 1

      }

      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              sendHeight();

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

    }

&lt;div class=&quot;rs-demo&quot;&gt;&lt;small&gt;DESIGN WALKTHROUGH · Fictional team · Simulated AI&lt;/small&gt;&lt;button class=&quot;rs-step&quot; data-screen=&quot;overview&quot;&gt;1 · Overview&lt;/button&gt;&lt;button class=&quot;rs-step&quot; data-screen=&quot;draft&quot;&gt;2 · Draft &amp; coach&lt;/button&gt;&lt;button class=&quot;rs-step&quot; data-screen=&quot;review&quot;&gt;3 · Review&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;rs-layout&quot;&gt;&lt;aside class=&quot;rs-rail&quot;&gt;&lt;div class=&quot;rs-wordmark&quot;&gt;the same page&lt;span style=&quot;color:var(--rs-brand)&quot;&gt;.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rs-navitem&quot;&gt;Mission Control&lt;/div&gt;&lt;div class=&quot;rs-navlabel&quot;&gt;Your people&lt;/div&gt;&lt;div class=&quot;rs-navitem&quot;&gt;Team&lt;/div&gt;&lt;div class=&quot;rs-navitem&quot;&gt;1:1s&lt;/div&gt;&lt;div class=&quot;rs-navitem&quot;&gt;Assessments&lt;/div&gt;&lt;div class=&quot;rs-navlabel&quot;&gt;The work&lt;/div&gt;&lt;div class=&quot;rs-navitem&quot;&gt;Goals&lt;/div&gt;&lt;div class=&quot;rs-navitem&quot;&gt;Projects&lt;/div&gt;&lt;div class=&quot;rs-navlabel&quot;&gt;Foundation&lt;/div&gt;&lt;div class=&quot;rs-navitem rs-selected&quot;&gt;Roles &amp; expectations&lt;/div&gt;&lt;div class=&quot;rs-navitem&quot;&gt;Knowledge&lt;/div&gt;&lt;div class=&quot;rs-navitem&quot;&gt;Settings&lt;/div&gt;&lt;/aside&gt;&lt;main class=&quot;rs-main&quot;&gt;&lt;div id=&quot;rs-view&quot;&gt;&lt;/div&gt;&lt;/main&gt;&lt;/div&gt;
&lt;script&gt;
(()=&gt;{
const root=document.getElementById(&#x27;role-studio&#x27;),view=root.querySelector(&#x27;#rs-view&#x27;);
const initial={screen:&#x27;overview&#x27;,target:&#x27;&#x27;,followup:&#x27;&#x27;,approved:false,saved:false,analyzed:false,ack:false,sourceOpen:false,notice:&#x27;&#x27;,items:[{title:&#x27;Own customer renewals&#x27;,kind:&#x27;Results&#x27;,responsibility:&#x27;Manage renewals for an assigned customer portfolio, identifying risks early and coordinating a response.&#x27;,meets:&#x27;Maintains a current renewal forecast, flags risks with a next step, and follows through on agreed renewal actions.&#x27;,exceeds:&#x27;Improves how the team identifies and responds to recurring renewal risks.&#x27;},{title:&#x27;Diagnose customer needs&#x27;,kind:&#x27;Skills&#x27;,responsibility:&#x27;Understand the customer’s goals and translate them into a practical success plan.&#x27;,meets:&#x27;Leads discovery independently and agrees a success plan with clear outcomes and owners.&#x27;,exceeds:&#x27;Recognizes patterns across accounts and helps teammates handle more complex customer needs.&#x27;},{title:&#x27;Close the loop&#x27;,kind:&#x27;Company value&#x27;,responsibility:&#x27;Make commitments clear and keep others informed.&#x27;,meets:&#x27;Follows through on commitments or communicates a change before others have to ask.&#x27;,exceeds:&#x27;&#x27;}]};
let s=structuredClone(initial);const design={density:&#x27;Comfortable&#x27;,coaching:&#x27;Alongside the draft&#x27;};
function restore(saved){const p=saved?.privateContent;if(p&amp;&amp;Array.isArray(p.items)&amp;&amp;p.items.length===3){s={...structuredClone(initial),...p};if(![&#x27;overview&#x27;,&#x27;draft&#x27;,&#x27;review&#x27;].includes(s.screen))s.screen=&#x27;overview&#x27;;}}
restore(window.openai?.widgetState);
const e=v=&gt;String(v??&#x27;&#x27;).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
function persist(){window.openai?.setWidgetState?.({modelContent:{screen:s.screen,approved:s.approved,retentionTarget:s.target||&#x27;Not set&#x27;,followup:s.followup||&#x27;Not scheduled&#x27;,coachingPlacement:design.coaching},privateContent:{...s,notice:&#x27;&#x27;}})?.catch(()=&gt;{});}
function message(){return s.notice?`&lt;div class=&quot;rs-message&quot; role=&quot;status&quot;&gt;${e(s.notice)}&lt;/div&gt;`:&#x27;&#x27;;}
function field(i,key,label,rows=3){return `&lt;label&gt;${label}&lt;textarea data-item=&quot;${i}&quot; data-key=&quot;${key}&quot; rows=&quot;${rows}&quot;&gt;${e(s.items[i][key])}&lt;/textarea&gt;&lt;/label&gt;`;}
function overview(){return `${message()}&lt;div class=&quot;rs-heading&quot;&gt;&lt;div&gt;&lt;div class=&quot;rs-eyebrow&quot;&gt;Your team’s foundation&lt;/div&gt;&lt;h1&gt;What good looks like.&lt;/h1&gt;&lt;p&gt;Clear expectations for every role, at every level.&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;rs-primary&quot; data-action=&quot;new&quot;&gt;+ Define a role&lt;/button&gt;&lt;/div&gt;&lt;section class=&quot;rs-panel rs-attention&quot;&gt;&lt;h2&gt;${s.approved&amp;&amp;s.target?&#x27;All expectations reviewed&#x27;:&#x27;Needs review&#x27;}&lt;/h2&gt;&lt;div class=&quot;rs-row&quot;&gt;&lt;div&gt;&lt;strong&gt;Customer Success Manager · Level 2&lt;/strong&gt;&lt;p&gt;${s.approved?(s.target?&#x27;Expectations approved. No open decisions.&#x27;:`Retention target still needs to be set · ${e(s.followup)}`):s.saved?&#x27;Working draft saved · ready to continue&#x27;:&#x27;First draft ready · retention target needs your input&#x27;}&lt;/p&gt;&lt;/div&gt;&lt;button data-screen=&quot;draft&quot;&gt;${s.approved?&#x27;Review role&#x27;:&#x27;Continue draft&#x27;} →&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;rs-panel&quot;&gt;&lt;div class=&quot;rs-heading&quot; style=&quot;margin-bottom:8px&quot;&gt;&lt;h2&gt;Roles &amp; ladders&lt;/h2&gt;&lt;span class=&quot;rs-muted&quot; style=&quot;font-size:12px&quot;&gt;3 ladders · 5 levels&lt;/span&gt;&lt;/div&gt;&lt;details open&gt;&lt;summary&gt;Customer Success&lt;/summary&gt;&lt;div class=&quot;rs-level&quot;&gt;&lt;div&gt;&lt;strong&gt;Level 1 · Customer Success Associate&lt;/strong&gt;&lt;small&gt;Maya Chen · Approved expectations&lt;/small&gt;&lt;/div&gt;&lt;span class=&quot;rs-badge rs-good&quot;&gt;✓ In use&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rs-level&quot;&gt;&lt;div&gt;&lt;strong&gt;Level 2 · Customer Success Manager&lt;/strong&gt;&lt;small&gt;Alex Rivera, Jordan Lee · ${s.approved?&#x27;Approved expectations&#x27;:&#x27;Job description added&#x27;}&lt;/small&gt;&lt;/div&gt;&lt;button data-screen=&quot;draft&quot;&gt;${s.approved?&#x27;View &amp; refine&#x27;:&#x27;Review draft&#x27;} →&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;rs-level&quot;&gt;&lt;div&gt;&lt;strong&gt;Level 3 · Senior Customer Success Manager&lt;/strong&gt;&lt;small&gt;No one assigned · Approved expectations&lt;/small&gt;&lt;/div&gt;&lt;span class=&quot;rs-badge rs-good&quot;&gt;✓ In use&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Implementation · 1 level&lt;/summary&gt;&lt;div class=&quot;rs-level&quot;&gt;&lt;div&gt;Level 1 · Implementation Specialist&lt;small&gt;Sam Patel · Approved expectations&lt;/small&gt;&lt;/div&gt;&lt;span class=&quot;rs-badge rs-good&quot;&gt;✓ In use&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Revenue Operations · 1 level&lt;/summary&gt;&lt;div class=&quot;rs-level&quot;&gt;&lt;div&gt;Level 2 · Revenue Operations Analyst&lt;small&gt;Taylor Reed · Approved expectations&lt;/small&gt;&lt;/div&gt;&lt;span class=&quot;rs-badge rs-good&quot;&gt;✓ In use&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;&lt;/section&gt;&lt;section class=&quot;rs-panel&quot;&gt;&lt;h3&gt;Shared across your company&lt;/h3&gt;&lt;p class=&quot;rs-muted&quot;&gt;Company values are defined once and included in each role.&lt;/p&gt;&lt;span class=&quot;rs-badge&quot;&gt;Close the loop&lt;/span&gt;&lt;/section&gt;&lt;div class=&quot;rs-foot&quot;&gt;&lt;span class=&quot;rs-muted&quot;&gt;Expectations stay connected to 1:1s, development, and assessments.&lt;/span&gt;&lt;/div&gt;`;}
function draft(){return `${message()}&lt;button class=&quot;rs-quiet&quot; data-screen=&quot;overview&quot;&gt;← All roles &amp; expectations&lt;/button&gt;&lt;div class=&quot;rs-heading&quot;&gt;&lt;div&gt;&lt;div class=&quot;rs-eyebrow&quot; style=&quot;margin-top:16px&quot;&gt;Customer Success ladder · Level 2&lt;/div&gt;&lt;h1&gt;Customer Success Manager&lt;/h1&gt;&lt;p&gt;Alex Rivera &amp; Jordan Lee &lt;span class=&quot;rs-badge&quot;&gt;${s.approved?&#x27;Working revision&#x27;:&#x27;Working draft&#x27;}&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;${s.approved?&#x27;&lt;div class=&quot;rs-message&quot;&gt;Approved expectations remain in use while you refine this revision.&lt;/div&gt;&#x27;:&#x27;&#x27;}&lt;details class=&quot;rs-source&quot; ${s.sourceOpen?&#x27;open&#x27;:&#x27;&#x27;}&gt;&lt;summary&gt;Source job description &lt;span class=&quot;rs-muted&quot;&gt;· Customer Success Manager&lt;/span&gt;&lt;/summary&gt;&lt;p&gt;Own customer relationships from adoption through renewal. Maintain accurate renewal forecasts, identify churn risks, and coordinate action across teams. Lead discovery conversations and develop success plans aligned with customer goals. Work independently on an assigned portfolio and contribute improvements to team processes.&lt;/p&gt;&lt;p&gt;Company value supplied separately: “Close the loop. Make commitments clear and keep others informed.”&lt;/p&gt;&lt;/details&gt;&lt;div class=&quot;rs-columns&quot;&gt;&lt;section class=&quot;rs-panel&quot;&gt;&lt;div class=&quot;rs-itemhead&quot;&gt;&lt;h2&gt;Role expectations&lt;/h2&gt;&lt;span class=&quot;rs-muted&quot; style=&quot;font-size:11px&quot;&gt;All fields editable&lt;/span&gt;&lt;/div&gt;${s.items.map((it,i)=&gt;`&lt;div class=&quot;rs-item&quot;&gt;&lt;div class=&quot;rs-itemhead&quot;&gt;&lt;h3&gt;${e(it.title)}&lt;/h3&gt;&lt;span class=&quot;rs-badge&quot;&gt;${e(it.kind)}&lt;/span&gt;&lt;/div&gt;&lt;label&gt;Expectation&lt;input data-item=&quot;${i}&quot; data-key=&quot;title&quot; value=&quot;${e(it.title)}&quot;&gt;&lt;/label&gt;${field(i,&#x27;responsibility&#x27;,&#x27;Responsibility&#x27;,2)}${field(i,&#x27;meets&#x27;,&#x27;Meets expectations&#x27;)}${i===0?`&lt;label&gt;Retention target&lt;input id=&quot;rs-target&quot; value=&quot;${e(s.target)}&quot; placeholder=&quot;Not set — add the agreed target&quot;&gt;&lt;/label&gt;&lt;div class=&quot;rs-muted&quot; style=&quot;font-size:11px;margin-top:6px&quot;&gt;No target was included in the source job description.&lt;/div&gt;`:&#x27;&#x27;}${field(i,&#x27;exceeds&#x27;,&#x27;Exceeds expectations · optional&#x27;,2)}&lt;div class=&quot;rs-muted&quot; style=&quot;font-size:11px;margin-top:9px&quot;&gt;${i===2?&#x27;Shared company value · role-level wording proposed for review&#x27;:&#x27;AI draft from your job description · review the wording&#x27;}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/section&gt;&lt;aside class=&quot;rs-panel rs-coach&quot;&gt;&lt;div class=&quot;rs-eyebrow&quot;&gt;AI thought partner&lt;/div&gt;&lt;h2&gt;${s.analyzed?&#x27;Your updated draft&#x27;:&#x27;One decision to make&#x27;}&lt;/h2&gt;&lt;p&gt;${s.target?&#x27;You’ve supplied a retention target. Check that its measurement period and the accounts it applies to are clear.&#x27;:&#x27;The job description asks this role to own renewals, but doesn’t define a retention target.&#x27;}&lt;/p&gt;&lt;h3&gt;${s.target?&#x27;Is the target ready to use?&#x27;:&#x27;Is there an agreed retention target?&#x27;}&lt;/h3&gt;&lt;p&gt;${s.target?&#x27;Your wording has been preserved. Review the full expectations before approving.&#x27;:&#x27;Add it to the draft, or set a time to come back. The role can still be put into use.&#x27;}&lt;/p&gt;&lt;label&gt;Revisit this decision&lt;select id=&quot;rs-followup&quot;&gt;&lt;option value=&quot;&quot;&gt;Choose a follow-up…&lt;/option&gt;&lt;option ${s.followup===&#x27;In one week&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;In one week&lt;/option&gt;&lt;option ${s.followup===&# &lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) =&gt; {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) =&gt; {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) =&gt; {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll(&quot;*&quot;)) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) =&gt; {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) =&gt; {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host &amp;&amp; !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger &amp;&amp; !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () =&gt; {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
