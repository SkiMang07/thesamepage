<style>
#role-studio{--rs-bg:light-dark(#F5F8FA,#182026);--rs-surface:light-dark(#fff,#222B32);--rs-raised:light-dark(#ECEFF2,#2D373E);--rs-ink:light-dark(#222B32,#F2F5F6);--rs-muted:light-dark(#686E74,#B6C0C5);--rs-line:light-dark(#DDE0E3,#3D4950);--rs-control:light-dark(#89949a,#77848C);--rs-brand:light-dark(#087E78,#50B7B0);--rs-on:light-dark(#fff,#08191B);--rs-tint:light-dark(#EEF5F4,#173D3B);--rs-amber:light-dark(#895410,#EDBE7A);--rs-attention:light-dark(#FFF5E5,#3B3020);--rs-blue:light-dark(#2367AE,#8DBFF3);--rs-blue-bg:light-dark(#EDF5FD,#203444);color:var(--rs-ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--rs-bg);border:1px solid var(--rs-line);border-radius:12px;overflow:hidden}

argin:0 0 8px}#role-studio p{margin:0 0 12px}#role-studio .rs-muted{color:var(--rs-muted)}#role-studio .rs-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--rs-muted)}#role-studio .rs-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}#role-studio .rs-heading p{margin:0;color:var(--rs-muted)}#role-studio .rs-panel{background:var(--rs-surface);border-radius:8px;padding:20px;margin-bottom:18px}#role-studio .rs-attention{background:var(--rs-attention);color:var(--rs-amber)}#role-studio .rs-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px 0;border-top:1px solid var(--rs-line)}#role-studio .rs-row:first-of-type{border-top:0}#role-studio .rs-row p{margin:3px 0 0;font-size:12px;color:var(--rs-muted)}#role-studio .rs-badge{font-size:11px;padding:3px 7px;border-radius:4px;background:var(--rs-raised);white-space:nowrap}#role-studio .rs-badge.rs-warn{color:var(--rs-amber);background:var(--rs-attention)}#role-studio .rs-badge.rs-good{color:var(--rs-brand);background:var(--rs-tint)}#role-studio details{border-top:1px solid var(--rs-line)}#role-studio summary{padding:15px 0;cursor:var(--cursor-interaction,pointer);font-weight:600}#role-studio .rs-level{padding:14px 0 14px 18px;border-top:1px solid var(--rs-line);display:flex;justify-content:space-between;align-items:center;gap:12px}#role-studio .rs-level small{display:block;color:var(--rs-muted);margin-top:3px}#role-studio .rs-columns{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(220px,1fr);gap:18px;align-items:start}#role-studio .rs-source{margin-bottom:18px;border:1px solid var(--rs-line);padding:0 14px;border-radius:7px;background:var(--rs-surface)}#role-studio .rs-source p{font-size:13px;color:var(--rs-muted)}#role-studio .rs-source summary{font-size:13px}#role-studio label{display:block;font-size:12px;color:var(--rs-muted);margin-top:12px}#role-studio textarea,#role-studio input,#role-studio select{width:100%;color:var(--rs-ink);background:var(--rs-raised);border:1px solid var(--rs-control);padding:9px 10px;border-radius:5px;margin-top:5px;min-width:0}#role-studio textarea{resize:vertical;min-height:78px}#role-studio .rs-item{padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--rs-line)}#role-studio .rs-item:last-child{border:0;padding:0;margin:0}#role-studio .rs-itemhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:9px}#role-studio .rs-itemhead h3{margin:0}#role-studio .rs-coach{background:var(--rs-blue-bg);border-top:3px solid var(--rs-blue)}#role-studio .rs-coach .rs-eyebrow{color:var(--rs-blue);margin-bottom:12px}#role-studio .rs-coach p{font-size:13px}#role-studio .rs-coach button{margin-top:10px}#role-studio .rs-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0;border-top:1px solid var(--rs-line);margin-top:12px;flex-wrap:wrap}#role-studio .rs-actions{display:flex;gap:10px;flex-wrap:wrap}#role-studio .rs-message{padding:10px 14px;margin-bottom:16px;background:var(--rs-tint);color:var(--rs-brand);border-radius:6px;font-size:13px}#role-studio .rs-review-item{padding:17px 0;border-top:1px solid var(--rs-line)}#role-studio .rs-review-item:first-child{border:0;padding-top:0}#role-studio .rs-review-item p{margin-bottom:8px}#role-studio .rs-review-item small{display:block;color:var(--rs-muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}#role-studio .rs-review-item .rs-description{color:var(--rs-muted)}#role-studio .rs-check{display:flex;align-items:flex-start;gap:9px;color:var(--rs-ink);font-size:13px;margin:15px 0}#role-studio .rs-check input{width:auto;margin-top:4px}#role-studio .rs-check label{margin:0;color:inherit;font-size:inherit}#role-studio.rs-compact .rs-panel{padding:14px}#role-studio.rs-compact .rs-row,#role-studio.rs-compact .rs-level{padding-top:10px;padding-bottom:10px}#role-studio.rs-inline-coach .rs-columns{grid-template-columns:1fr}#role-studio.rs-inline-coach .rs-coach{grid-row:1}#role-studio [hidden]{display:none!important}
@media(max-width:850px){#role-studio .rs-layout{grid-template-columns:1fr}#role-studio .rs-rail{display:none}#role-studio .rs-main{padding:22px 20px 0}}
@media(max-width:620px){#role-studio .rs-columns{grid-template-columns:1fr}#role-studio .rs-heading{align-items:flex-start;flex-direction:column}#role-studio .rs-row,#role-studio .rs-level{align-items:flex-start;flex-wrap:wrap}#role-studio .rs-main{padding:18px 14px 0}#role-studio .rs-demo{gap:4px;padding:9px}#role-studio .rs-demo small{width:100%}#role-studio input,#role-studio textarea,#role-studio select{font-size:16px}#role-studio h1{font-size:27px}#role-studio .rs-panel{padding:16px}}
</style>
<div class="rs-demo"><small>DESIGN WALKTHROUGH · Fictional team · Simulated AI</small><button class="rs-step" data-screen="overview">1 · Overview</button><button class="rs-step" data-screen="draft">2 · Draft & coach</button><button class="rs-step" data-screen="review">3 · Review</button></div>
<div class="rs-layout"><aside class="rs-rail"><div class="rs-wordmark">the same page<span style="color:var(--rs-brand)">.</span></div><div class="rs-navitem">Mission Control</div><div class="rs-navlabel">Your people</div><div class="rs-navitem">Team</div><div class="rs-navitem">1:1s</div><div class="rs-navitem">Assessments</div><div class="rs-navlabel">The work</div><div class="rs-navitem">Goals</div><div class="rs-navitem">Projects</div><div class="rs-navlabel">Foundation</div><div class="rs-navitem rs-selected">Roles & expectations</div><div class="rs-navitem">Knowledge</div><div class="rs-navitem">Settings</div></aside><main class="rs-main"><div id="rs-view"></div></main></div>
<script>
(()=>{
const root=document.getElementById('role-studio'),view=root.querySelector('#rs-view');
const initial={screen:'overview',target:'',followup:'',approved:false,saved:false,analyzed:false,ack:false,sourceOpen:false,notice:'',items:[{title:'Own customer renewals',kind:'Results',responsibility:'Manage renewals for an assigned customer portfolio, identifying risks early and coordinating a response.',meets:'Maintains a current renewal forecast, flags risks with a next step, and follows through on agreed renewal actions.',exceeds:'Improves how the team identifies and responds to recurring renewal risks.'},{title:'Diagnose customer needs',kind:'Skills',responsibility:'Understand the customer’s goals and translate them into a practical success plan.',meets:'Leads discovery independently and agrees a success plan with clear outcomes and owners.',exceeds:'Recognizes patterns across accounts and helps teammates handle more complex customer needs.'},{title:'Close the loop',kind:'Company value',responsibility:'Make commitments clear and keep others informed.',meets:'Follows through on commitments or communicates a change before others have to ask.',exceeds:''}]};
let s=structuredClone(initial);const design={density:'Comfortable',coaching:'Alongside the draft'};
function restore(saved){const p=saved?.privateContent;if(p&&Array.isArray(p.items)&&p.items.length===3){s={...structuredClone(initial),...p};if(!['overview','draft','review'].includes(s.screen))s.screen='overview';}}
restore(window.openai?.widgetState);
const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){window.openai?.setWidgetState?.({modelContent:{screen:s.screen,approved:s.approved,retentionTarget:s.target||'Not set',followup:s.followup||'Not scheduled',coachingPlacement:design.coaching},privateContent:{...s,notice:''}})?.catch(()=>{});}
function message(){return s.notice?`<div class="rs-message" role="status">${e(s.notice)}</div>`:'';}
function field(i,key,label,rows=3){return `<label>${label}<textarea data-item="${i}" data-key="${key}" rows="${rows}">${e(s.items[i][key])}</textarea></label>`;}
function overview(){return `${message()}<div class="rs-heading"><div><div class="rs-eyebrow">Your team’s foundation</div><h1>What good looks like.</h1><p>Clear expectations for every role, at every level.</p></div><button class="rs-primary" data-action="new">+ Define a role</button></div><section class="rs-panel rs-attention"><h2>${s.approved&&s.target?'All expectations reviewed':'Needs review'}</h2><div class="rs-row"><div><strong>Customer Success Manager · Level 2</strong><p>${s.approved?(s.target?'Expectations approved. No open decisions.':`Retention target still needs to be set · ${e(s.followup)}`):s.saved?'Working draft saved · ready to continue':'First draft ready · retention target needs your input'}</p></div><button data-screen="draft">${s.approved?'Review role':'Continue draft'} →</button></div></section><section class="rs-panel"><div class="rs-heading" style="margin-bottom:8px"><h2>Roles & ladders</h2><span class="rs-muted" style="font-size:12px">3 ladders · 5 levels</span></div><details open><summary>Customer Success</summary><div class="rs-level"><div><strong>Level 1 · Customer Success Associate</strong><small>Maya Chen · Approved expectations</small></div><span class="rs-badge rs-good">✓ In use</span></div><div class="rs-level"><div><strong>Level 2 · Customer Success Manager</strong><small>Alex Rivera, Jordan Lee · ${s.approved?'Approved expectations':'Job description added'}</small></div><button data-screen="draft">${s.approved?'View & refine':'Review draft'} →</button></div><div class="rs-level"><div><strong>Level 3 · Senior Customer Success Manager</strong><small>No one assigned · Approved expectations</small></div><span class="rs-badge rs-good">✓ In use</span></div></details><details><summary>Implementation · 1 level</summary><div class="rs-level"><div>Level 1 · Implementation Specialist<small>Sam Patel · Approved expectations</small></div><span class="rs-badge rs-good">✓ In use</span></div></details><details><summary>Revenue Operations · 1 level</summary><div class="rs-level"><div>Level 2 · Revenue Operations Analyst<small>Taylor Reed · Approved expectations</small></div><span class="rs-badge rs-good">✓ In use</span></div></details></section><section class="rs-panel"><h3>Shared across your company</h3><p class="rs-muted">Company values are defined once and included in each role.</p><span class="rs-badge">Close the loop</span></section><div class="rs-foot"><span class="rs-muted">Expectations stay connected to 1:1s, development, and assessments.</span></div>`;}
function draft(){return `${message()}<button class="rs-quiet" data-screen="overview">← All roles & expectations</button><div class="rs-heading"><div><div class="rs-eyebrow" style="margin-top:16px">Customer Success ladder · Level 2</div><h1>Customer Success Manager</h1><p>Alex Rivera & Jordan Lee <span class="rs-badge">${s.approved?'Working revision':'Working draft'}</span></p></div></div>${s.approved?'<div class="rs-message">Approved expectations remain in use while you refine this revision.</div>':''}<details class="rs-source" ${s.sourceOpen?'open':''}><summary>Source job description <span class="rs-muted">· Customer Success Manager</span></summary><p>Own customer relationships from adoption through renewal. Maintain accurate renewal forecasts, identify churn risks, and coordinate action across teams. Lead discovery conversations and develop success plans aligned with customer goals. Work independently on an assigned portfolio and contribute improvements to team processes.</p><p>Company value supplied separately: “Close the loop. Make commitments clear and keep others informed.”</p></details><div class="rs-columns"><section class="rs-panel"><div class="rs-itemhead"><h2>Role expectations</h2><span class="rs-muted" style="font-size:11px">All fields editable</span></div>${s.items.map((it,i)=>`<div class="rs-item"><div class="rs-itemhead"><h3>${e(it.title)}</h3><span class="rs-badge">${e(it.kind)}</span></div><label>Expectation<input data-item="${i}" data-key="title" value="${e(it.title)}"></label>${field(i,'responsibility','Responsibility',2)}${field(i,'meets','Meets expectations')}${i===0?`<label>Retention target<input id="rs-target" value="${e(s.target)}" placeholder="Not set — add the agreed target"></label><div class="rs-muted" style="font-size:11px;margin-top:6px">No target was included in the source job description.</div>`:''}${field(i,'exceeds','Exceeds expectations · optional',2)}<div class="rs-muted" style="font-size:11px;margin-top:9px">${i===2?'Shared company value · role-level wording proposed for review':'AI draft from your job description · review the wording'}</div></div>`).join('')}</section><aside class="rs-panel rs-coach"><div class="rs-eyebrow">AI thought partner</div><h2>${s.analyzed?'Your updated draft':'One decision to make'}</h2><p>${s.target?'You’ve supplied a retention target. Check that its measurement period and the accounts it applies to are clear.':'The job description asks this role to own renewals, but doesn’t define a retention target.'}</p><h3>${s.target?'Is the target ready to use?':'Is there an agreed retention target?'}</h3><p>${s.target?'Your wording has been preserved. Review the full expectations before approving.':'Add it to the draft, or set a time to come back. The role can still be put into use.'}</p><label>Revisit this decision<select id="rs-followup"><option value="">Choose a follow-up…</option><option ${s.followup==='In one week'?'selected':''}>In one week</option><option ${s.followup==='Before the next 1:1'?'selected':''}>Before the next 1:1</option><option ${s.followup==='Before assessment preparation'?'selected':''}>Before assessment preparation</option></select></label><p style="margin-top:12px;color:var(--rs-muted)">${s.followup?'This decision will stay in Needs review until the target is set.':'An unset target is never treated as a performance standard.'}</p>${s.analyzed?'<div class="rs-message">Draft saved. Your edits are preserved.</div>':''}<details><summary>Why these questions?</summary><p>Responsibilities came from the JD. “Meets” and “exceeds” wording is proposed for your review. No numeric targets were supplied or generated.</p></details></aside></div><div class="rs-foot"><button class="rs-quiet" data-action="later">Save & finish later</button><div class="rs-actions"><button data-action="analyze">Save & reanalyze</button><button class="rs-primary" data-action="to-review">Review for approval →</button></div></div>`;}
function review(){return `${message()}<button class="rs-quiet" data-screen="draft">← Back to editing</button><div class="rs-heading"><div><div class="rs-eyebrow" style="margin-top:16px">Customer Success Manager · Level 2</div><h1>Ready to put into practice?</h1><p>Review the expectations your coaching and assessments will use.</p></div></div><div class="rs-columns"><section class="rs-panel">${s.items.map((it,i)=>`<article class="rs-review-item"><div class="rs-itemhead"><h3>${e(it.title)}</h3><button class="rs-quiet" data-edit="${i}">Edit</button></div><p class="rs-description">${e(it.responsibility)}</p><small>Meets expectations</small><p>${e(it.meets)}</p>${i===0?`<small>Retention target</small><p>${s.target?e(s.target):'<span class="rs-badge rs-warn">Not set · excluded from evaluation</span>'}</p>`:''}${it.exceeds?`<small>Exceeds expectations</small><p>${e(it.exceeds)}</p>`:'<p class="rs-muted">Exceeds expectations: not defined.</p>'}</article>`).join('')}</section><aside><section class="rs-panel ${s.target?'':'rs-attention'}"><h2>${s.target?'Target supplied':'One detail remains open'}</h2><p>${s.target?e(s.target):'Retention target'}</p>${s.target?'<p class="rs-muted">Included in the expectations you approve.</p>':`<p>The responsibility can be used now. A numerical retention result will not be evaluated until a target is defined and approved.</p><label>Bring this back<select id="rs-followup"><option value="">Choose a follow-up…</option>${['In one week','Before the next 1:1','Before assessment preparation'].map(x=>`<option ${s.followup===x?'selected':''}>${x}</option>`).join('')}</select></label>`}</section><section class="rs-panel"><h3>After approval</h3><p class="rs-muted">Used in 1:1 preparation, development, and assessments for this role and level.</p><p class="rs-muted">Future changes go through review before replacing these expectations.</p></section></aside></div><div class="rs-check"><input type="checkbox" id="rs-ack" ${s.ack?'checked':''}><label for="rs-ack">I’ve reviewed these expectations${s.target?'':', including the unresolved retention target'}.</label></div><div id="rs-error" role="alert" style="color:var(--rs-amber)"></div><div class="rs-foot"><button class="rs-quiet" data-action="later">Save & finish later</button><button class="rs-primary" data-action="approve">Approve expectations</button></div>`;}
function render(){root.classList.toggle('rs-compact',design.density==='Compact');root.classList.toggle('rs-inline-coach',design.coaching==='Above the draft');root.querySelectorAll('[data-screen].rs-step').forEach(b=>{if(b.dataset.screen===s.screen)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});view.innerHTML=s.screen==='overview'?overview():s.screen==='draft'?draft():review();}
root.addEventListener('input',ev=>{const t=ev.target;if(t.id==='rs-ack'||t.id==='rs-followup')return;if(t.dataset.item!==undefined){s.items[+t.dataset.item][t.dataset.key]=t.value;s.ack=false;}if(t.id==='rs-target'){s.target=t.value;s.ack=false;}persist();});
root.addEventListener('change',ev=>{const t=ev.target;if(t.id==='rs-followup'){s.followup=t.value;s.ack=false;render();}if(t.id==='rs-ack')s.ack=t.checked;persist();});
root.addEventListener('toggle',ev=>{if(ev.target.classList?.contains('rs-source'))s.sourceOpen=ev.target.open;},true);
root.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.screen){s.screen=b.dataset.screen;s.notice='';render();persist();return;}if(b.dataset.edit!==undefined){s.screen='draft';s.notice='';render();view.querySelector(`[data-item="${b.dataset.edit}"]`)?.focus();persist();return;}switch(b.dataset.action){case'new':s.screen='draft';s.notice='Sample new-role draft, after importing a job description. Edit the example below.';break;case'later':s.saved=true;s.screen='overview';s.notice='Draft saved. You can continue from Needs review.';break;case'analyze':s.saved=true;s.analyzed=true;s.notice='Simulated reanalysis complete. Your edits are saved; the coaching question reflects the target you supplied or left open.';break;case'to-review':s.screen='review';s.notice='';break;case'approve':if(!s.ack||(!s.target&&!s.followup)){root.querySelector('#rs-error').textContent=!s.target&&!s.followup?'Choose when to revisit the missing target, then confirm your review.':'Confirm that you’ve reviewed the expectations.';return;}s.approved=true;s.saved=true;s.screen='overview';s.notice=s.target?'Expectations approved in this walkthrough. The role is ready to use.':`Expectations approved in this walkthrough. Retention target remains in Needs review · ${s.followup}.`;break;default:return;}render();persist();});
window.addEventListener('openai:set_globals',ev=>{if(ev.detail?.globals?.widgetState){restore(ev.detail.globals.widgetState);render();}});
render();if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{render();persist();}});t.addSelect(design,'coaching',{label:'Coaching placement',options:['Alongside the draft','Above the draft']});t.addSelect(design,'density',{label:'Spacing',options:['Comfortable','Compact']});}
})();
</script>
</div>
