# Runs on every push and pull request. Railway and Vercel deploy on push
# regardless of this result; CI is the alarm, not the gate. It exists because
# a half-committed two-part change once broke main for seven hours, and the
# working tree type-checked fine while HEAD did not. CI only ever sees HEAD.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Placeholders only. Config validates these at import; no test reaches
    # Supabase or a model provider.
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiJ9.eyJyb2xlIjoiYW5vbiJ9.c2ln
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiJ9.eyJyb2xlIjoic2VydmljZSJ9.c2ln
      ANTHROPIC_API_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches backend/.python-version (Railway)
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt

  frontend:
    name: Frontend type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # package-lock.json is gitignored, so this resolves the same ranges
      # Vercel does on each build.
      - run: npm install --no-audit --no-fund
      # next-env.d.ts is generated by `next dev`/`next build` and gitignored.
      # Recreate the two type references tsc needs; the third line points at
      # .next/types, which only a build produces.
      - run: |
          printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts
      - run: npx tsc --noEmit
      # Two thresholds. What ships to the browser or server (dependencies) fails
      # on high. Build-only tools (devDependencies) fail on critical: Tailwind 3
      # pulls in braces, whose high-severity advisory (GHSA-vfj7-8cjw-p6xm) has
      # no fixed version and only touches the build-time file watcher. The way
      # out is Tailwind 4; see docs/ENGINEERING.md → Open questions.
      - name: Dependency audit (shipped code)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit (build tools)
        run: npm audit --audit-level=critical
