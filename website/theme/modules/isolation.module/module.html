="290" height="336" rx="16" filter="url(#isosh-{{ name }})"/><circle class="d-control" cx="382" cy="80" r="8"/><rect class="d-heading" x="402" y="75" width="104" height="10" rx="4.5"/><rect class="d-control" x="382" y="100" width="64" height="10" rx="4.5"/><line class="s-hairline" x1="370" y1="128" x2="620" y2="128" stroke-width="1"/><rect class="d-recorded" x="382" y="150" width="18" height="18" rx="6"/><rect class="d-pill" x="414" y="154" width="150" height="10" rx="4.5"/><rect class="d-recorded" x="382" y="194" width="18" height="18" rx="6"/><rect class="d-pill" x="414" y="198" width="124" height="10" rx="4.5"/><text class="mono d-label" x="685" y="26" font-size="12" letter-spacing="1.4">{{ module.viewer_other_org }}</text><rect class="d-canvas s-control" x="685" y="42" width="290" height="336" rx="16" stroke-width="1"/></svg></div>
      {% if module.caption %}<figcaption class="iso-cap">{{ module.caption }}</figcaption>{% endif %}
    </figure>
  </div>
</section>
