<section class="sec">
  <div class="wrap">
    <div class="sec-head">
      <div class="rule"></div>
      <h2 class="h2">{{ module.heading }}</h2>
      {% if module.lede %}<p class="lede">{{ module.lede }}</p>{% endif %}
    </div>
    <figure class="dfig two">
      <div class="two-stage"><svg viewBox="-24 -8 1048 440" role="img" aria-label="Two records side by side. The left one carries a single quarter stamp, five identical rows and no teal at all. The right one carries a different day stamp on every row, marks in three different states, and your own teal identity dot."><defs><filter id="twosh-{{ name }}" x="-45%" y="-45%" width="190%" height="190%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity="0.17"/><feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.09"/></filter></defs><text class="mono d-label" x="15" y="26" font-size="12" letter-spacing="1.4">{{ module.record_left }}</text><rect class="d-surface" x="15" y="42" width="430" height="340" rx="16" filter="url(#twosh-{{ name }})"/><circle class="d-control" cx="47" cy="82" r="8"/><rect class="d-heading" x="67" y="77" width="118" height="10" rx="4.5"/><rect class="d-control" x="47" y="104" width="70" height="10" rx="4.5"/><line class="s-hairline" x1="35" y1="132" x2="425" y2="132" stroke-width="1"/><text class="mono d-label" x="413" y="90" text-anchor="end" font-size="14" letter-spacing="1.6">{{ module.stamp }}</text><rect class="d-recorded" x="47" y="154" width="18" height="18" rx="6"/><rect class="d-control" x="79" y="158" width="72" height="10" rx="4.5"/><rect class="d-pill" x="163" y="158" width="210" height="10" rx="4.5"/><rect class="d-recorded" x="47" y="198" width="18" height="18" rx="6"/><rect class="d-control" x="79" y="202" width="72" height="10" rx="4.5"/><rect class="d-pill" x="163" y="202" width="198" height="10" rx="4.5"/><rect class="d-recorded" x="47" y="242" width="18" height="18" rx="6"/><rect class="d-control" x="79" y="246" width="72" height="10" rx="4.5"/><rect class="d-pill" x="163" y="246" width="214" height="10" rx="4.5"/><rect class="d-recorded" x="47" y="286" width="18" height="18" rx="6"/><rect class="d-control" x="79" y="290" width="72" height="10" rx="4.5"/><rect class="d-pill" x="163" y="290" width="202" height="10" rx="4.5"/><rect class="d-recorded" x="47" y="330" width="18" height="18" rx="6"/><rect class="d-control" x="79" y="334" width="72" height="10" rx="4.5"/><rect class="d-pill" x="163" y="334" width="206" height="10" rx="4.5"/><text class="mono d-label" x="555" y="26" font-size="12" letter-spacing="1.4">{{ module.record_right }}</text><rect class="d-surface" x="555" y="42" width="430" height="340" rx="16" filter="url(#twosh-{{ name }})"/><circle class="d-brand" cx="587" cy="82" r="8"/><rect class="d-heading" x="607" y="77" width="118" height="10" rx="4.5"/><rect class="d-control" x="587" y="104" width="70" height="10" rx="4.5"/><line class="s-hairline" x1="575" y1="132" x2="965" y2="132" stroke-width="1"/><text class="mono d-heading" x="587" y="167" font-size="11.5" letter-spacing="1.2">TUE</text><rect class="d-brand" x="641" y="154" width="18" height="18" rx="6"/><rect class="d-pill" x="673" y="158" width="228" height="10" rx="4.5"/><text class="mono d-heading" x="587" y="211" font-size="11.5" letter-spacing="1.2">TUE</text><rect class="d-recorded" x="641" y="198" width="18" height="18" rx="6"/><rect class="d-pill" x="673" y="202" width="176" height="10" rx="4.5"/><text class="mono d-heading" x="587" y="255" font-size="11.5" letter-spacing="1.2">THU</text><rect class="d-brand" x="641" y="242" width="18" height="18" rx="6"/><rect class="d-pill" x="673" y="246" width="246" height="10" rx="4.5"/><text class="mono d-heading" x="587" y="299" font-size="11.5" letter-spacing="1.2">FRI</text><rect class="d-open" x="641" y="286" width="18" height="18" rx="6" stroke-width="2.5"/><rect class="d-pill" x="673" y="290" width="194" height="10" rx="4.5"/><text class="mono d-heading" x="587" y="343" font-size="11.5" letter-spacing="1.2">MON</text><rect class="d-recorded" x="641" y="330" width="18" height="18" rx="6"/><rect class="d-pill" x="673" y="334" width="212" height="10" rx="4.5"/></svg></div>
      {% if module.caption %}<figcaption class="two-cap">{{ module.caption }}</figcaption>{% endif %}
