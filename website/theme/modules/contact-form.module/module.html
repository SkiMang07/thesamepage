<section class="ct-form" id="note" aria-labelledby="ct-form-{{ name }}">
  <div class="wrap ct-form-grid">
    <div>
      <h2 class="h2" id="ct-form-{{ name }}">{{ module.heading }}</h2>
      <div class="ct-form-lede">{{ module.lede }}</div>
    </div>
    <div class="form-card">
      {% form
        form_to_use="{{ module.form.form_id }}"
        response_response_type="{{ module.form.response_type }}"
        response_message="{{ module.form.message }}"
      %}
      {% if module.response_note %}<p class="form-note">{{ module.response_note }}</p>{% endif %}
      <div class="consent-copy">{{ module.consent_copy }}</div>
    </div>
  </div>
</section>
