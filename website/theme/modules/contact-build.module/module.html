<section class="ct-build" aria-labelledby="ct-build-{{ name }}">
  <div class="wrap ct-build-grid">
    <div>
      <span class="ct-micro ct-micro-brand">{{ module.eyebrow }}</span>
      <h2 class="h2" id="ct-build-{{ name }}">{{ module.heading }}</h2>
      <div class="ct-build-copy">{{ module.lede }}</div>
      {% if module.more_label %}<a class="btn btn-ghost ct-more" href="{{ module.more_url }}">{{ module.more_label }} <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>{% endif %}
    </div>
    <div class="ct-countdown" id="ct-cd-{{ name }}" data-end="{{ module.launch_at }}" role="timer" aria-label="Countdown to launch, {{ module.launch_label }}">
      <div class="ct-cd-top"><span class="ct-micro">Launch countdown</span><span class="ct-cd-date">{{ module.launch_label }}</span></div>
      <div class="ct-cd-units">
        <div class="ct-cd-u"><b data-u="d">{{ module.days_fallback }}</b><span>Days</span></div>
        <div class="ct-cd-u"><b data-u="h">00</b><span>Hours</span></div>
        <div class="ct-cd-u"><b data-u="m">00</b><span>Min</span></div>
        <div class="ct-cd-u"><b data-u="s">00</b><span>Sec</span></div>
      </div>
      <p class="ct-cd-foot"><b>{{ module.foot_strong }}</b> {{ module.foot_rest }}</p>
    </div>
  </div>
  <script>
  (function(){
    var box=document.getElementById("ct-cd-{{ name }}"); if(!box) return;
    var end=new Date(box.getAttribute("data-end")).getTime(); if(isNaN(end)) return;
    function el(u){return box.querySelector('[data-u="'+u+'"]');}
    var D=el("d"),H=el("h"),M=el("m"),S=el("s");
    function pad(n){return (n<10?"0":"")+n;}
    function tick(){
      var t=Math.max(0,end-Date.now());
      D.textContent=Math.floor(t/864e5); H.textContent=pad(Math.floor(t/36e5)%24);
      M.textContent=pad(Math.floor(t/6e4)%60); S.textContent=pad(Math.floor(t/1e3)%60);
    }
    tick(); setInterval(tick,1000);
  })();
  </script>
</section>
