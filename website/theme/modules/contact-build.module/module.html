<section class="ct-build" id="early-access" aria-labelledby="ct-build-{{ name }}">
  <div class="wrap ct-split">
    <div class="ct-side">
      <span class="ct-micro ct-micro-brand">{{ module.eyebrow }}</span>
      <h2 class="h2" id="ct-build-{{ name }}">{{ module.heading }}</h2>
    </div>
    <div class="ct-main">
    <div class="ct-build-copy">{{ module.lede }}</div>
    <div class="ct-launch" id="ct-cd-{{ name }}" data-end="{{ module.launch_at }}">
      <span class="ct-micro">{{ module.launch_label }}</span><i class="ct-lead" aria-hidden="true"></i><span class="ct-days" role="timer" aria-label="Days until launch"><b data-u="d">{{ module.days_fallback }}</b> days to go</span>
    </div>
    </div>
  </div>
  <script>
  (function(){
    var box=document.getElementById("ct-cd-{{ name }}"); if(!box) return;
    var end=new Date(box.getAttribute("data-end")).getTime(); if(isNaN(end)) return;
    var D=box.querySelector('[data-u="d"]'); if(!D) return;
    function tick(){ D.textContent=Math.floor(Math.max(0,end-Date.now())/864e5); }
    tick(); setInterval(tick,60000);
  })();
  </script>
</section>
