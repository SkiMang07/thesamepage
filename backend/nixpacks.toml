# Railway build config (Session 28 — Context Engine Session II; reworked
# Session 44's live test).
#
# Two routes shell out to headless LibreOffice for X→PDF conversion before
# handing the result to Claude's native PDF/vision support:
#   - routes/documents.py  — PPTX uploads (Context Engine, Session 28)
#   - routes/roles_import.py — DOCX job descriptions (Session 44)
# Nixpacks' Python provider has no reason to install LibreOffice on its
# own, so it must be added explicitly here or those uploads 502 in
# production (see convert_to_pdf in routes/documents.py).
#
# Session 44 live test: the original `nixPkgs = ["...", "libreoffice"]`
# line still produced "no LibreOffice binary on PATH" in production — the
# nix package either wasn't landing in the image or didn't expose the
# expected binary names. Switched to aptPkgs, the mechanism Railway's own
# docs recommend for system packages: the Debian packages reliably provide
# both `soffice` and the `libreoffice` wrapper on PATH.
# `libreoffice-writer` covers DOCX→PDF, `libreoffice-impress` covers
# PPTX→PDF; installing the two components instead of the `libreoffice`
# metapackage keeps the image meaningfully smaller (no calc/base/draw).
# convert_to_pdf resolves the binary via shutil.which over both names, so
# either install mechanism works if this ever changes again.
#
# Known cost: still a few hundred MB and a longer Railway build versus
# every other route in this app. Accepted since Session 28 ("ship the
# pipeline, not optimize the build") — revisit if build time becomes
# painful (e.g. moving conversion to a separate worker service so the main
# API image stays lean).
[phases.setup]
nixPkgs = ["..."]
aptPkgs = ["libreoffice-writer", "libreoffice-impress"]
